  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - action.yml
  - repo-truth.json
  - src/config.ts
  - src/registry.ts
  - src/index.ts
  - src/action.ts
  - src/checks/**
  - test/unit/config.test.ts
  - test/unit/registry.test.ts
  - test/unit/registry-options.test.ts
  - test/unit/action.test.ts
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:cli-config]
exclusive_resources: []

