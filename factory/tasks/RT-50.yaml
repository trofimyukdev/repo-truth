id: RT-50
repo: repo-truth
priority: 39
milestone: M0
title: Suite strength, weakened tests - tests that fail on the defects the mutation probe found unasserted in src/weakened-tests.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The check
  of weakened tests (RT-04) merged with such survivors: defects in how
  git's own error, and a failure git reports without a word, reach the
  evidence, in how a revision that cannot be a commit is refused before
  git runs, in how a finding's text is escaped and worded, in how the
  lines of a change are numbered, in which marker lines count as moved,
  in how git's listing of changes is read when a name begins with a colon
  or a path is a symbolic link, in how a caller's spellings are matched
  and named, and in how a caller's sanction is read. Each one is a way the
  check could break without a test saying so. This task adds the tests
  that say so. It changes no source file.

  Written on 2026-10-19 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe recorded as surviving back into the module and demands that the
  suite turn red on each. No line of the test file may itself read as a
  skip or focus marker once its quoted strings are set aside, so every
  marker the suite writes into a fixture sits in a string that opens and
  closes on that same line, as the suite's existing cases do.

  Reissued on 2026-10-21, after the first version was set aside: its fix
  cycle did not fit a tick, and the factory's reason for setting it aside
  named splitting the task as the road. One behavior the first version
  asked for - a skip line the range moves within one test file while a
  document listed before that file gains the same line - is now RT-51, a
  task of its own with a test file of its own. This version asks for every
  other behavior of the first one, unchanged.

measure:
  - npx vitest run test/unit/weakened-tests.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/weakened-tests.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/weakened-tests.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/weakened-tests.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/weakened-tests.test.ts calls `checkWeakenedTests`
      of src/weakened-tests.ts over real throwaway repositories, as its
      existing cases do, and asserts the records it returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `checkWeakenedTests`, each by an
      assertion that a defect in it would change. Errors: a directory that
      exists and is not a git repository yields a `fail` record whose
      evidence carries git's own complaint, which says it is not a git
      repository, and not node's wording of the failed command, which opens
      `Command failed`; a revision git cannot find, such as a branch that
      does not exist, for which git exits without a word, yields one whose
      evidence opens `revision "<revision>" does not name a commit: ` and
      goes on to name the git command that failed, which holds
      `<revision>^{commit}`; a revision that is empty yields one whose
      evidence reads exactly `revision "" does not name a commit`, before
      git runs, and so does a revision that begins with a minus sign, `-x`
      say, its own text between the quotes; and a revision
      one character long that names a commit, such as `@`, is resolved and
      judged like any other - a range whose candidate is `@` and which
      lowers nothing passes.
  - type: behavior
    statement: >
      The text of a finding: its detail is `test newly skipped: ` followed
      by the added line, trimmed, for a skip, and `run newly focused: `
      followed by the line for a focus marker; and in the evidence every
      character outside printable ASCII is written as `\u{`, its code point
      in hexadecimal padded to four digits, and `}` - an escape character, U+001B, in the name
      of a test the range skips is printed as `\u{001b}` - while a tilde,
      the last printable ASCII character, is printed as it is.
  - type: behavior
    statement: >
      Lines: a test file that holds a NUL byte is read as holding no line,
      so deleting it yields the finding `test-file-deleted:<file>:0`; in a
      base test file that does not end with a newline, a skipped test the
      range adds after the last line is reported at that test's own line,
      git's note that the file has no final newline counting as no line; a
      hunk that adds several lines numbers each one, so a skip on the
      second of two added lines is reported at that line; and an assertion
      removed from a test declared on one line - `it("adds", () =>
      expect(1 + 1).toBe(2));` becoming `it("adds", () => {});` - is
      reported as removed from test "adds".
  - type: behavior
    statement: >
      Moves: two identical assertions removed from one test and one of
      them added back elsewhere in it, so that git's diff shows both
      removed and one added - `expect(a).toBe(1);` twice before a line that
      stays, once after it - yield one `assertion-removed` finding; and a skip
      line the range removes from a file outside the marker's scope, a
      document, and adds to a test file is reported, since only a marker can
      move.
  - type: behavior
    statement: >
      Git's listing and links: a file renamed with its content unchanged to
      a name that begins with a colon, which git allows - `a.txt` to
      `:b.txt` - in a range that also adds a skip to a test file, leaves
      that skip reported; and a symbolic link the range adds under a test
      file's name, whose target is the text `it.only`, yields no finding,
      since a link is not read as a file of lines.
  - type: behavior
    statement: >
      Spellings and sanctions: a caller's spelling whose pattern carries the
      global flag `g` and is anchored at the start, `^` - a `testFiles`
      entry that names the files under `spec/`, say - is matched from the
      start of each path every time, so a skip added to such a file that
      no default spelling names, `spec/parse.js`, is reported; the `testNamePattern` spelling counts only in a runner's
      configuration file, so added to a plain source file it yields no
      finding; a caller's test spelling with no group named `name` takes
      the test's name from its first group, so a test it declares that the
      range removes is reported as `test "<that group>" removed`; and a
      caller's sanction reason one character long sanctions its finding.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      a git that fails is made by the repository the test builds, never by
      a stub on the path; nothing is installed or fetched; and no test
      reads src/weakened-tests.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-50.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
