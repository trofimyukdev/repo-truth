id: RT-49
repo: repo-truth
priority: 40
milestone: M0
title: Suite strength, portable paths - tests that fail on the defects the mutation probe found unasserted in src/portable-paths.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The check
  of portable paths (RT-10) merged with such survivors: defects in how
  git's own error, and a failure git reports without a word, reach the
  evidence, in how a revision that cannot be a commit is refused before
  git runs, in how two commits that share no history, and a commit whose
  tree git cannot read, are named, in how a name is escaped in the
  evidence, and in how a name one character long is read. Each one is a
  way the check could break without a test saying so. This task adds the
  tests that say so. It changes no source file.

  Written on 2026-10-19 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe recorded as surviving back into the module and demands that the
  suite turn red on each.

measure:
  - npx vitest run test/unit/portable-paths.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/portable-paths.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/portable-paths.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/portable-paths.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/portable-paths.test.ts calls `checkPortablePaths`
      of src/portable-paths.ts over real throwaway repositories, as its
      existing cases do, and asserts the records it returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `checkPortablePaths`, each by an
      assertion that a defect in it would change. Errors: a directory that
      exists and is not a git repository yields a `fail` record whose
      evidence carries git's own complaint, which says it is not a git
      repository, and not node's wording of the failed command, which opens
      `Command failed`; a revision git cannot find, such as a branch that
      does not exist, for which git exits without a word, yields one whose
      evidence opens `revision "<revision>" names no commit: ` and goes on
      to name the git command that failed, which holds
      `<revision>^{commit}`; a revision that is empty yields one whose
      evidence reads exactly `revision "" names no commit`, before git
      runs, and so does a revision that begins with a minus sign, `-x` say,
      its own text between the quotes; a revision one character long that
      names a commit, such as `@`, is resolved and judged like any other -
      a range whose candidate is `@` and which introduces only portable
      names passes; two commits that share no history - a branch
      made with `git checkout --orphan`, say - yield one whose evidence opens
      `no merge base of <a> and <b>: `, where `<a>` and `<b>` are the first
      twelve characters of the two commits' ids, and goes on to name the git
      command that failed; and a candidate whose tree git cannot read - its
      tree object removed from the throwaway repository's object store, the
      base's left whole - yields one whose evidence opens `could not read
      the tree of <c>: `, where `<c>` is the first twelve characters of the
      candidate's id.
  - type: behavior
    statement: >
      Names and the passing record: a tilde, the last printable ASCII
      character, is printed in the evidence as it is - an added file
      `notes~.` is reported, under the rule of a name that ends in a dot,
      as `"notes~."`; a name one character long is judged like any other -
      an added file named `?` is reported under the rule of a character
      Windows forbids; and a range whose introduced names are all portable
      passes with the one evidence line `<n> name(s) introduced in
      "<base>".."<candidate>", all portable`, where `<n>` counts the names
      the range introduces - a new file at the top of the tree is one name,
      a new file in a new directory two - while a range that introduces no
      name passes with the one line `no name introduced in
      "<base>".."<candidate>"`.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      a git that fails is made by the repository the test builds, never by
      a stub on the path; nothing is installed or fetched; and no test
      reads src/portable-paths.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-49.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/portable-paths.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-portable-paths]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
