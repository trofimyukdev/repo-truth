id: RT-52
repo: repo-truth
priority: 37
milestone: M0
title: Suite strength, commit-range hygiene - tests that fail on the defects the mutation probe finds unasserted in src/commit-range.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The check
  of commit-range hygiene (RT-01) merged before the factory took that
  measure, and taken now with the factory's own mutation generator it
  finds such survivors: defects in how git's own error reaches the
  evidence, in how a range with no commit and a range of one commit are
  answered, in how a character is escaped in the evidence and which
  characters count as printable, and in how a finding's line names its
  commit. Each one is a way the check could break without a test saying
  so. This task adds the tests that say so. It changes no source file.

  Written on 2026-10-21 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the surviving
  defects back into the module and demands that the suite turn red on
  each.

measure:
  - npx vitest run test/unit/commit-range.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/commit-range.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/commit-range.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/commit-range.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/commit-range.test.ts calls `checkCommitRange` of
      src/commit-range.ts over real throwaway repositories, as its existing
      cases do, and asserts the records it returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `checkCommitRange`, each by an
      assertion that a defect in it would change. Errors: a directory that
      exists and is not a git repository yields a `fail` record whose
      evidence carries git's own complaint, which says it is not a git
      repository, and not node's wording of the failed command, which opens
      `Command failed`. Ranges: a range with no commit in it - the base and
      the candidate the same commit - passes with the evidence exactly
      `range <base>..<candidate> is empty`, the two revisions as the caller
      gave them; and a range of exactly one commit is read like any other,
      so one commit whose message holds a character outside printable ASCII
      fails.
  - type: behavior
    statement: >
      The text of a finding: each line of a field that holds a character
      outside printable ASCII and tab yields one evidence line, which reads
      the first twelve characters of the commit's id, `: `, the field's
      label (`commit message`, `author name`, `author e-mail`, `committer
      name` or `committer e-mail`), ` contains a character outside printable
      ASCII/tab: `, and the line in double quotes, escaped. In that line
      every character outside printable ASCII and tab is written as `\u{`,
      its code point in hexadecimal padded to four digits, and `}` - `e`
      with an acute accent, U+00E9, as `\u{00e9}` - while every printable
      ASCII character, the space and the tilde among them, and the tab are
      written as they are. A message that holds a tilde, the last printable
      ASCII character, and a tab, and no other character outside printable
      ASCII, passes.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      a git that fails is made by the repository the test builds, never by
      a stub on the path; nothing is installed or fetched; and no test
      reads src/commit-range.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-52.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/commit-range.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-commit-range]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

