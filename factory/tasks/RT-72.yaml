id: RT-72
repo: repo-truth
priority: 19
milestone: M0
title: Suite strength, autosquash leftovers - tests that fail on the defects the mutation probe leaves unasserted in src/checks/autosquash.ts

outcome: >
  The factory measures how strong a module's tests are by planting small
  defects in it and counting the ones no test notices. Taken on
  origin/main with the factory's own mutation generator, the suite of
  src/checks/autosquash.ts (RT-29) leaves such defects alive: in how a
  failure of git while it reads the range reaches the evidence, and in
  which characters of a subject count as printable. Each one is a way the
  check could break without a test saying so. This task adds the tests
  that say so. It changes no source file.

  Written on 2026-10-24 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe leaves surviving back into the module and demands that the suite
  turn red on each.

  The project_truth rung runs this package's own checks over the change,
  among them RT-24, which reports a timeout setting a range adds to a test
  file the merge base holds; so the tests this task adds set no timeout of
  their own.

measure:
  - npx vitest run test/unit/autosquash.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/checks/autosquash.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/autosquash.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/autosquash.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/autosquash.test.ts calls `check` of
      src/checks/autosquash.ts over real throwaway repositories, as
      its existing cases do, and asserts the records it returns.
  - type: behavior
    statement: >
      A range git cannot read - a commit between the base and the
      candidate whose object was removed from the repository - yields
      a `fail` record with one evidence line that opens `git failed: `
      followed by git's own complaint, not node's wording of the
      failed command, which opens `Command failed`.
  - type: behavior
    statement: >
      A subject that holds a tilde, the last printable ASCII
      character, is written as it is: a commit `fixup! a~b` yields the
      evidence line of the first twelve characters of its id, a space,
      and `fixup! a~b`.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its
      own whose text holds none of the words threshold, coverage,
      minimum, min, maximum, max, at least or at most, so that a later
      edit of a fixture is not read as a bound moved in a test.
      Fixtures are built at run time, those that need a repository in
      throwaway repositories under the operating system's temporary
      directory, removed when the suite ends whether it passed or not;
      a git that fails is made by the repository the test builds,
      never by a stub on the path; nothing is installed or fetched;
      and no test reads src/checks/autosquash.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-72.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/autosquash.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - action.yml
  - repo-truth.json
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-autosquash]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
