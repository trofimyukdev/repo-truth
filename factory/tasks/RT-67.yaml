id: RT-67
repo: repo-truth
priority: 24
milestone: M0
title: Suite strength, configuration reader - tests that fail on the defects the mutation probe leaves unasserted in src/config.ts

outcome: >
  The factory measures how strong a module's tests are by planting small
  defects in it and counting the ones no test notices. Taken on
  origin/main with the factory's own mutation generator, the suite of
  src/config.ts, which reads repo-truth.json, leaves such defects alive:
  in how a document that is not an object is named, in how one issue is
  counted in the first line of the message, in which characters count as
  printable, in how a failure of git reaches the refusal - git that exits
  with a code, git that cannot be run, and each of its reads failing - and
  in how a configuration file that is no regular file is named. Each one
  is a way the reader could break without a test saying so. This task adds
  the tests that say so. It changes no source file.

  Written on 2026-10-24 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe leaves surviving back into the module and demands that the suite
  turn red on each.

  The project_truth rung runs this package's own checks over the change,
  among them RT-24, which reports a timeout setting a range adds to a test
  file the merge base holds; so the tests this task adds set no timeout of
  their own.

measure:
  - npx vitest run test/unit/config.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/config.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/config.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/config.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/config.test.ts calls `parseConfig` and
      `readConfig` of src/config.ts, as its existing cases do -
      `readConfig` over real throwaway repositories - and asserts the
      issues the items below name, each exactly as written there.
  - type: behavior
    statement: >
      Documents: `parseConfig` refuses a document that is not an
      object with the one issue `the document: expected a JSON object,
      found ` and what it found - `null` for null, `an array` for an
      array, `a number` for a number and `a string` for a string.
      Messages: the first line of the message of a refusal of
      `parseConfig` with one issue - a refusal that names no source -
      is exactly `1 configuration issue`, in the singular; and in an
      issue every printable ASCII character, the tilde, the last of
      them, among them, is written as it is - an unknown check named
      `a~b` is the issue `checks.a~b: unknown check`.
  - type: behavior
    statement: >
      Git: `readConfig` with no path, in a directory that exists and
      is no git repository, refuses with one issue that opens `git
      rev-parse failed (exit 128): ` and carries git's own complaint,
      which says it is not a git repository; in a directory that does
      not exist it refuses with one issue that opens `git could not be
      run: `. A base whose tree git cannot read - its tree object
      removed from the repository - is refused with one issue that
      opens `git ls-tree failed (exit 128): `, and a base whose
      repo-truth.json blob git cannot read with one issue that opens
      `git cat-file failed (exit 128): `; neither is read as a base
      with no file or as an empty document.
  - type: behavior
    statement: >
      A base whose repo-truth.json is a symbolic link is refused with
      exactly the issue `repo-truth.json: expected a regular file,
      found a blob (mode 120000) at ` followed by the first twelve
      characters of the base's id.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its
      own whose text holds none of the words threshold, coverage,
      minimum, min, maximum, max, at least or at most, so that a later
      edit of a fixture is not read as a bound moved in a test.
      Fixtures are built at run time, those that need a repository in
      throwaway repositories under the operating system's temporary
      directory, removed when the suite ends whether it passed or not;
      a git that fails is made by the repository the test builds,
      never by a stub on the path; nothing is installed or fetched;
      and no test reads src/config.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-67.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/config.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - action.yml
  - repo-truth.json
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-config]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
