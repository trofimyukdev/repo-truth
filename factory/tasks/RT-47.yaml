id: RT-47
repo: repo-truth
priority: 42
milestone: M0
title: Suite strength, the measurement rule - tests that fail on the defects the mutation probe found unasserted in src/measurement-rule.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The check
  of the measurement rule (RT-02) merged with such survivors: defects in
  how git's own error reaches the evidence, in how a revision that names
  no commit is refused, in where a fenced block opens and closes, in how
  a document is split into paragraphs - its last one included - and in
  which lines of a document the range counts as added. Each one is a way
  the check could break without a test saying so. This task adds the
  tests that say so. It changes no source file.

  Written on 2026-10-19 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe recorded as surviving back into the module and demands that the
  suite turn red on each.

measure:
  - npx vitest run test/unit/measurement-rule.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/measurement-rule.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/measurement-rule.test.ts changes - the module, another test, a fixture or a document committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/measurement-rule.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/measurement-rule.test.ts calls
      `checkMeasurementRule` of src/measurement-rule.ts over real throwaway
      repositories, as its existing cases do, and asserts the records it
      returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `checkMeasurementRule`, each by an
      assertion that a defect in it would change. Revisions and errors: a
      revision git cannot find, such as a branch that does not exist,
      given as the candidate, yields a `fail` record whose evidence is the
      one line `revision <revision> names no commit`, exactly; a revision
      one character long that names a commit, such as `@`, is resolved and
      judged like any other - a range whose candidate is `@` and whose
      commit body states a figure with no command and no date yields a
      `fail` record that reports that figure; and a base
      and a candidate on two histories that share nothing - a branch made
      with `git checkout --orphan`, say - yield a `fail` record whose
      evidence opens `git failed while reading <base>..<candidate>: ` and
      goes on with git's own complaint, which says there is no merge base,
      and not node's wording of the failed command, which opens `Command
      failed`.
  - type: behavior
    statement: >
      Fenced blocks, in a commit body: a line after a fence that opened
      with three backticks and closed with three backticks is the author's
      prose again, so a figure on it, in a body with no date, is reported;
      a fence holding several lines keeps every one of them out of the
      prose, so a figure on its second line or a later one is never
      reported; a closing run of three backticks indented by one to three
      spaces closes the fence, so a figure on the line after it is
      reported; an opening run indented by one to three spaces is closed
      by an unindented run of the same length, so a figure on the line
      after that is reported; and a run shorter than the opening one does
      not close it even when indented - inside a fence opened by four
      backticks, a line of three backticks indented by one space is still
      inside the fence, so a figure on the line after it, before the four
      closing backticks, is never reported.
  - type: behavior
    statement: >
      Documents: a paragraph is the lines between two blank lines, so in an
      added document whose first paragraph holds a command and a date, a
      figure in a later paragraph that holds neither is reported; the last
      paragraph of a document that does not end with a newline, one line
      long, is read like any other, so a figure on it is reported; a change
      that adds exactly one line to a document that already existed - git
      writes no count in that hunk's header - is read, so a figure on that
      line is reported with the line's number; the first line of a run of
      added lines is read like the others; and a line the range adds
      directly before an old line that states a figure, in a paragraph with
      no command and no date, leaves that old line unreported.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      every document a test needs is written there at run time; a git that
      fails is made by the repository the test builds, never by a stub on
      the path; nothing is installed or fetched; and no test reads
      src/measurement-rule.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-47.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/measurement-rule.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-measurement-rule]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
