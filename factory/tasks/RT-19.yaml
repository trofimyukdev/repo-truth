id: RT-19
repo: repo-truth
priority: 67
milestone: M0
title: Replayed figures - a git command a page or a commit quotes, run again, prints what the claim says

outcome: >
  RT-02 asks that a figure carry the command that printed it and the date it
  was taken; it never runs the command. A figure copied from an older page,
  rounded, or simply wrong carries a command and a date as well as a true one
  does, and reads exactly like a measurement until somebody runs it again.
  This repository's own pages write their figures in one form - a git
  command in a code span, the word printed, and the output in a code span -
  and that form can be checked by a machine: run the command again on the
  commits it names and compare. This check does that for the claims a range
  adds, and only for commands it can run without a shell and without
  writing anything, on commits named by their ids, so that the answer is the
  same on any clone. A command it cannot run is counted as not replayable
  and never failed, because a page of shell examples is not a defect.

  This version is the check alone. The first asked one module to read the
  claims, to decide which commands may run and to run them, and the
  candidate built to it was too large for the factory's mutation probe to
  finish measuring. On the operator's word of 2026-10-07 the task was split:
  RT-21 reads the claims, RT-20 decides which command text may run, and
  this check runs what RT-20 plans for each claim RT-21 reads, compares and
  reports. What a caller sees - the record, its findings and the registry
  entry - is the first version's.

  Written on 2026-10-06 by the operator's word of that day, with RT-14 to
  RT-18, and made this version on 2026-10-07 by his word of that day, under
  his rule of 2026-09-30 that every not_done_if line of a spec in this
  repository is covered by a holdout acceptance item or by a deterministic
  check the spec names: the holdout item below is the gate's, and the
  builder is never shown it.

measure:
  - npx vitest run test/unit/replayed-figures.test.ts

not_done_if:
  - "a claim the check cannot replay fails the record, so every page with a shell example fails the check"
  - "a replayed output that differs from the claim, or a claim naming a commit the repository does not hold, passes"
  - "a finding does not name where the claim is, the command, what the replay printed and what the claim says"
  - "a replay that does not end holds the check, and the command with it, forever"
  - "a revision that names no commit, a failure the claim reader answers, or a git invocation other than a replay that fails, is reported as a pass or thrown to the caller instead of a `fail` record naming the cause"
  - "the check is missing from `REGISTRY`, so `repo-truth check` never runs it and `--check RT-19` is refused as an unknown check"
  - "the check reads claims or decides what may run with code of its own instead of `readFigureClaims` and `planReplay`, so the three tasks can disagree about one claim and this module grows back to the size its first candidate was"
  - "a planned command is run through a shell, or with words other than its plan's, so a quoted word the planner admitted is expanded when it runs"

acceptance:
  - type: command
    command: npx vitest run test/unit/replayed-figures.test.ts
    required: true
  - type: behavior
    statement: >
      `src/replayed-figures.ts` exports `checkReplayedFigures(options)`, where
      `options` is `{ cwd, base, candidate, timeoutMs? }`, and which resolves
      to a `CheckRecord` (src/index.ts) named `RT-19`. It reads the range's
      claims with `readFigureClaims` (src/figure-claims.ts) and asks
      `planReplay` (src/replay-plan.ts) whether each one may run, both
      imported rather than restated: the module holds no reader of pages or
      commits, no word splitter and no option list of its own, and it
      changes neither of those two modules. A claim whose command
      `planReplay` answers `null` for is counted as not replayable and never
      failed.
  - type: behavior
    statement: >
      A planned claim is replayed by running `git --no-pager` followed by
      the plan's `args`, as an argument vector with no shell, in `cwd`,
      bounded in time by `timeoutMs` when the caller gives it and otherwise
      by a default the module states, at most thirty seconds; a replay still
      running at its bound is stopped. Its output is what git wrote to
      stdout without its final newline, or, when the plan's `countLines` is
      true, the number of newline characters git wrote, in decimal. The
      claim is reproduced when that output equals the claimed output. A
      different output, a commit of the plan's `commits` the repository does
      not hold, a non-zero exit and a replay that ran out of time are
      findings.
  - type: behavior
    statement: >
      Each finding is one evidence line that opens with the claim's `where`
      and a colon - `<path>:<line>:` for a page, the line of the claimed
      output in the candidate, or the commit's id, at least its first seven
      characters, for a commit body. It holds
      the command, the word `printed` and what the replay printed - or the
      words `does not hold` and the commit id, the exit code, or `timed out`
      - and the word `claims` and the claimed output, with every character
      outside printable ASCII escaped and each output cut to a length the
      module states. The record fails when there is a finding, and then its
      evidence holds the finding lines and nothing else; otherwise it passes
      with one evidence line holding the number of claims reproduced with
      the word `reproduced`, and the number not replayable with the words
      `not replayable`.
  - type: behavior
    statement: >
      The check fails closed: a failure `readFigureClaims` answers - a
      revision that names no commit among them - yields a `fail` record whose
      evidence holds that failure's text, and a git invocation other than a
      replay that fails yields one whose evidence names the cause - never a
      `pass`, and never a thrown error.
  - type: behavior
    statement: >
      `REGISTRY` (src/registry.ts) gains one entry, `RT-19`, running
      `checkReplayedFigures`, so `repo-truth check --check RT-19` runs it
      alone; that entry and its import are the only lines of src/registry.ts
      the task changes. Tests build real throwaway repositories and drive a
      claim reproduced by each subcommand and by `| wc -l`, a wrong figure, a
      claim with no pinned revision, a commit the repository does not hold, a
      claim in a commit body, a replay that exits non-zero, a replay that
      cannot finish within the `timeoutMs` it is given - made slow by the
      test, with a git first on PATH that sleeps before it runs, because a
      bound of a millisecond races a fast git and that test then fails at
      random - which is a finding holding `timed out`, a revision that names
      no commit, a second command after `;` and a single-quoted command
      substitution inside a format word the planner admits, each with a
      marker file the command would create if a shell ran it, asserted
      absent after the check, and assert the record of each. The reader's
      and the planner's own cases are RT-21's and RT-20's and are not
      repeated here.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-19.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - src/replayed-figures.ts
  - src/registry.ts
  - test/unit/replayed-figures.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - README.md
  - LICENSE
  - package.json
  - package-lock.json
  - src/replay-plan.ts
  - src/figure-claims.ts

dependencies: [RT-20, RT-21]
discovered_from: null
resources: [repo-truth:registry, repo-truth:git]
exclusive_resources: []

risk:
  level: high
  dimensions: [contract, security]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 4.00
  verify_usd: 2.50
  wall_minutes: 45

merge: { mode: auto }
