id: RT-82
repo: repo-truth
priority: 24
milestone: M0
title: Suite strength, the command, again after RT-60 and RT-65 - tests that fail on the defects the mutation probe leaves unasserted in src/cli.ts

outcome: >
  The factory measures how strong a module's tests are by planting small
  defects in it and counting the ones no test notices. RT-39 strengthened
  the suite of src/cli.ts, and RT-60 and RT-65 have changed the module
  since. Taken again on origin/main with the factory's own mutation
  generator, the command's own suites - test/unit/cli.test.ts,
  test/unit/cli-config.test.ts and test/unit/config-handoff.test.ts -
  leave alive defects in three behaviors: that `--base` and `--target` are
  refused together, that one `--check` runs that check alone, and that
  `--target` is refused outside a pull request's event while `--base` runs
  under any event. Each one is a way the command could break without a
  test of the command saying so. This task adds the tests that say so. It
  changes no source file.

  Written on 2026-10-26 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe leaves surviving back into the module and demands that the suite
  turn red on each.

  The project_truth rung runs this package's own checks over the change,
  among them RT-24, which reports a timeout setting a range adds to a test
  file the merge base holds; so the tests this task adds set no timeout of
  their own.

measure:
  - npx vitest run test/unit/cli.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/cli.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/cli.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/cli.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/cli.test.ts calls `main` of src/cli.ts, as
      its existing cases do, with checks of its own in the registry
      where a case needs them, and passes `main` an environment of its
      own where a case needs one, never by changing the environment of
      the process the suite runs in.
  - type: behavior
    statement: >
      `--base` given together with `--target` is a bad invocation:
      exit 2, nothing on stdout, and the message on stderr says
      `--base and --target are exclusive`.
  - type: behavior
    statement: >
      One `--check` runs that check alone: with three checks
      registered, a run whose one `--check` names the second runs that
      check and no other, and exits as its record says.
  - type: behavior
    statement: >
      `--target` resolves a pull request's range and is refused
      outside one: with `GITHUB_EVENT_NAME` set to `push`, a run that
      names its range with `--target` is a bad invocation - exit 2,
      the message on stderr naming the `push` event - and no check
      runs; with the same event, a run that names its range with
      `--base` runs its checks and exits as it would with no event
      set.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its
      own whose text holds none of the words threshold, coverage,
      minimum, min, maximum, max, at least or at most, so that a later
      edit of a fixture is not read as a bound moved in a test.
      Fixtures are built at run time, those that need a repository in
      throwaway repositories under the operating system's temporary
      directory, removed when the suite ends whether it passed or not;
      a git that fails is made by the repository the test builds,
      never by a stub on the path; nothing is installed or fetched;
      and no test reads src/cli.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-82.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/cli.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - action.yml
  - repo-truth.json
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-cli-again]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
