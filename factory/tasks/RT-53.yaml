id: RT-53
repo: repo-truth
priority: 36
milestone: M0
title: Suite strength, figure claims - tests that fail on the defects the mutation probe found unasserted in src/figure-claims.ts

outcome: >
  The factory measures how strong a module's tests are by planting small
  defects in it and counting the ones no test notices. The reader of
  figure claims (RT-21) merged with such survivors: defects in how git's
  own error reaches the failure it returns, in how a revision that cannot
  be a commit is refused before git runs, in how a page that is not a
  regular file is set aside, and in which lines of a page the range adds -
  the last line of a new page with no final newline, and an old line just
  below an added one. Each one is a
  way the reader could break without a test saying so. This task adds the
  tests that say so. It changes no source file.

  Written on 2026-10-21 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe recorded as surviving back into the module and demands that the
  suite turn red on each.

measure:
  - npx vitest run test/unit/figure-claims.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/figure-claims.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/figure-claims.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/figure-claims.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/figure-claims.test.ts calls `readFigureClaims` of
      src/figure-claims.ts over real throwaway repositories, as its existing
      cases do, and asserts the results it returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `readFigureClaims`, each by an
      assertion that a defect in it would change. Errors: a directory that
      exists and is not a git repository yields a `failure` that carries
      git's own complaint, which says it is not a git repository, and not
      node's wording of the failed command, which opens `Command failed`; a
      revision that is empty yields a `failure` that reads exactly
      `revision "" does not name a commit`, before git runs, and so does a
      revision that begins with a minus sign, `-x` say, its own text between
      the quotes; and a revision one character long that names a commit,
      such as `@`, is resolved like any other - a range whose candidate is
      `@` yields the claims it adds.
  - type: behavior
    statement: >
      Pages: a path ending in `.md` that the range adds as something other
      than a regular file - a symbolic link whose target is the text of a
      claim, say - is no page, and yields no claim; a page the range adds
      that does not end with a newline yields the claim on its last line;
      and a line the range adds to an old page directly above a claim the
      page already held does not make that old claim the range's - only
      the lines the range adds can hold a claim.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      a git that fails is made by the repository the test builds, never by
      a stub on the path; nothing is installed or fetched; and no test
      reads src/figure-claims.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-53.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/figure-claims.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-figure-claims]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

