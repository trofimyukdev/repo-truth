id: RT-79
repo: repo-truth
priority: 26
milestone: M0
title: Suite strength, configuration changes - tests that fail on the defects the mutation probe leaves unasserted in src/checks/config-changes.ts

outcome: >
  The factory measures how strong a module's tests are by planting small
  defects in it and counting the ones no test notices. RT-66 landed
  src/checks/config-changes.ts on 2026-10-25 with such defects, and its
  gate recorded them for a later task. Taken on origin/main with the
  factory's own mutation generator, the module's suite leaves them alive:
  in how a failure of git reaches the evidence, in how the evidence
  escapes what it quotes, in which revisions are refused before git runs,
  in how a `--config` that names the top directory or the one above it is
  answered, and in which reasons of the caller's sanctions count. Each one
  is a way the check could break without a test saying so. This task adds
  the tests that say so. It changes no source file.

  Written on 2026-10-25 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe leaves surviving back into the module and demands that the suite
  turn red on each.

  The project_truth rung runs this package's own checks over the change,
  among them RT-24, which reports a timeout setting a range adds to a test
  file the merge base holds; so the tests this task adds set no timeout of
  their own.

measure:
  - npx vitest run test/unit/config-changes.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/checks/config-changes.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/config-changes.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/config-changes.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/config-changes.test.ts calls `check` of
      src/checks/config-changes.ts over real throwaway repositories,
      as its existing cases do, and asserts the records it returns.
  - type: behavior
    statement: >
      Git's failures: run in a directory that is not a repository, the
      record fails with one evidence line that opens `revision "<the
      base>" does not name a commit: ` followed by git's own
      complaint, not node's wording of the failed command, which opens
      `Command failed`; over a base and a candidate that share no
      history, it fails with one evidence line that opens `no merge
      base of "<the base>" and "<the candidate>": `.
  - type: behavior
    statement: >
      Escaping: the evidence keeps every printable ASCII character as
      it is, the tilde included, and writes every other character as
      `\u{` and at least four hexadecimal digits and `}` - a
      `--config` file outside the repository whose name holds a tilde,
      a letter outside ASCII and a control character is a `skip` whose
      one evidence line is that path written so, followed by `:
      outside the repository, no range can change it`.
  - type: behavior
    statement: >
      Revisions refused before git runs: a base or a candidate that is
      empty, or that begins with `-`, yields a `fail` record with
      exactly the one evidence line `revision "<it>" does not name a
      commit` and nothing after it; a revision one character long that
      names a commit, `@`, is resolved like any other.
  - type: behavior
    statement: >
      A `--config` that names the top directory itself, or the
      directory above it, is a `skip` whose one evidence line is the
      path as given followed by `: outside the repository, no range
      can change it`.
  - type: behavior
    statement: >
      The caller's sanctions: a sanction whose reason is empty or
      white space alone sanctions nothing and the finding fails; a
      sanction whose reason is one character sanctions it, the
      evidence line ending ` - sanctioned: ` and that character.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its
      own whose text holds none of the words threshold, coverage,
      minimum, min, maximum, max, at least or at most, so that a later
      edit of a fixture is not read as a bound moved in a test.
      Fixtures are built at run time, those that need a repository in
      throwaway repositories under the operating system's temporary
      directory, removed when the suite ends whether it passed or not;
      a git that fails is made by the repository the test builds,
      never by a stub on the path; nothing is installed or fetched;
      and no test reads src/checks/config-changes.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-79.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/config-changes.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - action.yml
  - repo-truth.json
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-config-changes]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
