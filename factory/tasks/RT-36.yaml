id: RT-36
repo: repo-truth
priority: 53
milestone: M0
title: Suite strength, suppression directives - tests that fail on the defects the mutation probe found unasserted in src/checks/suppressions.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The
  suppression directives check (RT-31) merged with such survivors: defects
  in how git's own error reaches the evidence, in how a revision that
  cannot be a commit is refused before git runs, in how a path and a
  revision are escaped, in how the lines of a file the range changes are
  read from git's diff - which of them count as removed and as added, and
  what text of each a directive is looked for in. Each one is a way the
  check could break without a test saying so. This task adds the tests
  that say so. It changes no source file.

  Written on 2026-10-14 by the operator's word of that day, under his rule
  of 2026-09-30 that every not_done_if line of a spec in this repository
  is covered by a holdout acceptance item or by a deterministic check the
  spec names: the holdout item below is the gate's, and the builder is
  never shown it. A change of tests alone gives the factory's mutation
  probe nothing to mutate, so the holdout is what shows these tests are
  strong: it plants the defects the probe recorded as surviving into the
  module and demands that the suite turn red on each. The check this
  suite tests reports a directive written out in a source file, so no
  line of the suite writes one out whole: each is joined from parts at
  run time, as the suite already does.

measure:
  - npx vitest run test/unit/suppressions.test.ts

not_done_if:
  - "a defect the mutation probe recorded as surviving in src/checks/suppressions.ts at RT-31's merge, planted back into the module, still leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/suppressions.test.ts changes - the module, another test, package.json - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"
  - "a line the change adds writes a type-checker, linter or coverage directive out whole right after a comment opener, so the check the suite tests would report the suite's own change"

acceptance:
  - type: command
    command: npx vitest run test/unit/suppressions.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/suppressions.test.ts calls `check` of
      src/checks/suppressions.ts over real throwaway repositories and
      asserts the records it returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `check`, each by an assertion that a
      defect in it would change. Errors: a directory that exists and is not
      a git repository yields a `fail` record whose evidence carries git's
      own complaint, which says it is not a git repository, and not node's
      wording of the failed command, which opens `Command failed`; a
      revision that names no commit yields one whose evidence carries, after
      the revision and the words `does not name a commit:`, the message of
      the git command that refused it, which names `rev-parse`; and a
      revision that is empty, or that begins with a minus sign, yields one
      whose evidence reads exactly `revision "<revision>" does not name a
      commit`, before git runs.
  - type: behavior
    statement: >
      Escaping: a path and a revision are printed in the evidence with every
      character outside printable ASCII written as a backslash, `u{`, its
      code point in lowercase hexadecimal padded with zeros to at least four
      digits, and `}`, and a space and a tilde as they are.
  - type: behavior
    statement: >
      Reading a file the range changes, whose lines come from git's diff of
      its two versions: a directive line the range rewrites in place - the
      same directive, with other words after it - counts as one removed and
      one added in that file, so the two pair and the range passes; each
      line is matched as the file holds it, without the sign the diff puts
      before it, so an entry appended to `SUPPRESSION_DIRECTIVES` whose
      pattern is anchored at the start of a line finds a match at the start
      of a line the range adds to such a file; and only the lines of the
      diff's hunks are read, so an appended entry whose pattern matches
      once at the start of every line, as `^` does, yields one finding for
      each line the range adds to such a
      file, each at its line number in the candidate, and none for any line
      git prints before the first hunk.
  - type: behavior
    statement: >
      No line of the suite writes a type-checker, linter or coverage
      directive out whole right after a comment opener: every directive a
      test needs is joined from parts at run time. Each fixture number sits
      in a constant declared on a line of its own whose text holds none of
      the words threshold, coverage, minimum, min, maximum, max, at least or
      at most, so that a later edit of a fixture is not read as a bound
      moved in a test. Fixtures are built at run time in throwaway
      repositories under the operating system's temporary directory and
      removed when the suite ends, whether it passed or not; a git that
      fails is made by the repository the test builds, never by a stub on
      the path; an entry a test appends to `SUPPRESSION_DIRECTIVES` is
      removed again whether the test passed or not; nothing is installed or
      fetched; and no test reads src/checks/suppressions.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-36.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/suppressions.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - test/e2e/**

