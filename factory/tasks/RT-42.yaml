id: RT-42
repo: repo-truth
priority: 47
milestone: M0
title: Suite strength, ladder commands changed - tests that fail on the defects the mutation probe found unasserted in src/checks/script-changes.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The check
  of ladder commands changed (RT-33) merged with such survivors: defects
  in how git's own error reaches the evidence, in how a revision that
  cannot be a commit is refused before git runs, in how a tilde is
  printed, in how a manifest that is JSON but not an object, or that is a
  symbolic link, is refused, in the order the findings are reported, and
  in how a sanction's reason is read from the caller and from a commit
  message. Each one is a way the check could break without a test saying
  so. This task adds the tests that say so. It changes no source file.

  Written on 2026-10-17 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe recorded as surviving back into the module and demands that the
  suite turn red on each. The factory that builds this repository refuses
  a change to the `scripts` field of its own package.json, so every
  manifest the suite needs is written at run time into a throwaway
  repository, as the suite already does.

measure:
  - npx vitest run test/unit/script-changes.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/checks/script-changes.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/script-changes.test.ts changes - the module, another test, package.json, a manifest committed as a fixture - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/script-changes.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/script-changes.test.ts calls `check` of
      src/checks/script-changes.ts over real throwaway repositories, as its
      existing cases do, and asserts the records it returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `check`, each by an assertion that a
      defect in it would change. Errors: a directory that exists and is not
      a git repository yields a `fail` record whose evidence carries git's
      own complaint, which says it is not a git repository, and not node's
      wording of the failed command, which opens `Command failed`; a
      revision that is empty, or that begins with a minus sign, yields one
      whose evidence reads exactly `revision "<revision>" does not name a
      commit`, before git runs; and a revision one character long that
      names a commit, such as `@`, is resolved and judged like any other.
  - type: behavior
    statement: >
      Manifests and text: a package.json that is JSON but not an object -
      a number, and `null` - at the candidate yields a `fail` record whose
      evidence names the file and says it is not a JSON object; a
      package.json that is a symbolic link at the candidate yields one whose
      evidence names the file and says it is not a regular file; and a
      tilde in an entry's name or command, the last printable ASCII
      character, is printed in the evidence as it is.
  - type: behavior
    statement: >
      Order: the findings, and the lines of evidence that describe them,
      come sorted by the manifest's path and, within one manifest, by the
      entry's name, whatever order the manifest holds its entries in: every
      finding of the manifest whose path sorts first comes before any
      finding of another, even when its entry's name sorts after theirs. The
      tests that pin it add at least three entries to one manifest in an
      order that is neither sorted nor sorted backwards, such as `b`, `c`,
      `a`, and, in one range, an entry `z` to package.json and an entry `a`
      to a package.json below it, and assert the whole order of the
      findings each time.
  - type: behavior
    statement: >
      Sanctions: a reason the caller gives in `sanctions` that is empty or
      only blanks sanctions nothing, so the finding stays open and the
      record fails, while a reason one character long sanctions it; and a
      range whose one finding is sanctioned by a line in a commit message of
      the range passes.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      every package.json a test needs is written there at run time; a git
      that fails is made by the repository the test builds, never by a stub
      on the path; nothing is installed or fetched; and no test reads
      src/checks/script-changes.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-42.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/script-changes.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - test/e2e/**

