id: RT-08
repo: repo-truth
priority: 74
milestone: M0
title: A GitHub Action wrapper that resolves the range a pull request actually is

outcome: >
  The checks are only adopted if using them costs a few lines of workflow rather
  than a script per repository. The wrapper is thin on purpose - it resolves the
  range and calls the command from RT-07, and it owns nothing else - because the
  hard half is the resolution: a pull request's range is the merge base against
  the target branch, not the target branch's tip, and a default shallow checkout
  does not contain the merge base at all. A wrapper that gets this wrong reports a
  clean result on the wrong range, which is worse than reporting nothing, and it
  does so silently on exactly the repositories most likely to adopt it.

  REISSUED on 2026-10-04 by the operator's word, under his rule of 2026-09-30
  that every not_done_if line of a spec in this repository is covered by a
  holdout acceptance item or by a deterministic check the spec names. The
  first version, never built, declared neither. This version adds one holdout
  item, which the gate runs and the builder is never shown, and states in the
  acceptance below the interface it measures: one new option of RT-07's
  command, `--target`, and what it answers - the merge base, the failure for
  missing history, the rule for an event that is not a pull request - and
  where the action file lives. The action file moves out of `.github/`: the
  factory refuses every change under that directory to an ordinary task, so
  the first version could not have been built as written. The not_done_if
  lines are unchanged.

measure:
  - npx vitest run test/unit/action.test.ts

not_done_if:
  - "the range is taken as `origin/<target>..HEAD` rather than the merge base, so commits already on the target are re-checked and a rebased branch reports findings that are not its own"
  - "a shallow checkout that does not contain the merge base yields a pass instead of a stated failure naming the fetch depth as the cause"
  - "the wrapper re-implements any check rather than calling the entry point from RT-07"
  - "a check failure is reported as a workflow error, or a workflow error as a check failure, so the exit-code contract RT-07 pins is lost at the boundary that most consumers see"
  - "the range resolution lives only in shell inside a YAML file and has no test, which is where this kind of defect always survives"
  - "the wrapper is documented as working on push events as well as pull requests without a stated range rule for them"

acceptance:
  - type: command
    command: npx vitest run test/unit/action.test.ts
    required: true
  - type: behavior
    statement: >
      Range resolution is a tested function in `src/`, not shell embedded in YAML.
      Tests cover a pull request against a moved target branch, a rebased branch,
      and a merge commit on the target, and assert the resolved base is the merge
      base in each.
  - type: behavior
    statement: >
      The resolution is reached through RT-07's command, which gains one option:
      `repo-truth check --target <rev> --candidate <rev>`. `--target` names the
      branch the pull request merges into and is given in place of `--base`;
      giving both, or neither, is a bad invocation. It is resolved as `--base`
      is - after the fetch unless `--no-fetch` is given, and a `--target` that
      names no commit is a bad invocation - and the base of the range is then
      the merge base of the target and the candidate, the commit that
      `git merge-base <target> <candidate>` prints, never the target's tip. The
      JSON document's `base` is that merge base. Everything else RT-07 states
      is kept as it is: the exit codes, the JSON document, `REGISTRY`, and the
      options `--check`, `--format` and `--no-fetch`.
  - type: behavior
    statement: >
      A checkout that does not contain the merge base produces a failure naming
      the missing history and the fetch depth needed, never a pass. A test drives
      a shallow fixture and asserts the message says what to change. Through
      `--target` that failure is the bad-invocation code 2 with nothing on
      stdout and no check run, and stderr says that the merge base is missing
      and that the checkout needs `fetch-depth: 0`, the actions/checkout input.
  - type: behavior
    statement: >
      The wrapper's own outcome distinguishes a check failure from a wrapper
      failure using the exit codes RT-07 states, asserted by a test rather than
      by reading the workflow file. Through `--target`, a check that fails or
      throws exits 1 with the JSON document, and a range that cannot be
      resolved exits 2 with nothing on stdout.
  - type: behavior
    statement: >
      This task states no range rule for push events, and the wrapper does not
      claim them. When the environment variable `GITHUB_EVENT_NAME` is set to an
      event other than `pull_request` or `pull_request_target`, `--target` is a
      bad invocation: exit 2, nothing on stdout, no check run, and stderr names
      the event. Without that variable, as in a local run, `--target` works as
      stated above. `--base` never reads it, so a workflow run by a push event
      names its range with RT-07's own `--base`.
  - type: behavior
    statement: >
      The wrapper is `action.yml` at the repository root - the file a workflow's
      `uses: <owner>/repo-truth@<ref>` line resolves - a composite action
      (`runs.using: composite`) whose step runs the built `repo-truth check`
      with `--target` set to the pull request's target branch as the checkout's
      remote-tracking ref and `--candidate` set to the pull request's head
      commit, and exits with the command's own code. It holds no range logic of
      its own. Nothing under `.github/` belongs to this task: the factory
      refuses a change there to every ordinary task.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-08.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - src/**
  - test/unit/**
  - action.yml
forbidden_paths:
  - factory/**
  - .github/**
  - README.md
  - LICENSE

dependencies: [RT-07]
discovered_from: null
resources: [repo-truth:cli]
exclusive_resources: []

risk:
  level: medium
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
