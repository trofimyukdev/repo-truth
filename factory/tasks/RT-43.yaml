id: RT-43
repo: repo-truth
priority: 46
milestone: M0
title: Suite strength, conflict markers - tests that fail on the defects the mutation probe found unasserted in src/conflict-markers.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The check
  of conflict markers (RT-09) merged with such survivors: defects in how
  git's own error, and a failure git reports without a word, reach the
  evidence, in how a revision that cannot be a commit is refused before
  git runs, in how a path is escaped in the evidence - the characters
  below a space, the delete character and the second range of control
  characters escaped, every other character printed as it is - in how
  the lines a range removes from one file are counted so that the files
  after it are still read, and in the count of added lines a passing
  record states. Each one is a way the check could break without a test
  saying so. This task adds the tests that say so. It changes no source
  file.

  Written on 2026-10-18 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe recorded as surviving back into the module and demands that the
  suite turn red on each. No line of the test file may itself be a
  conflict marker, so the suite builds every marker at run time, as it
  already does.

measure:
  - npx vitest run test/unit/conflict-markers.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/conflict-markers.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/conflict-markers.test.ts changes - the module, another test, a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/conflict-markers.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/conflict-markers.test.ts calls
      `checkConflictMarkers` of src/conflict-markers.ts over real throwaway
      repositories, as its existing cases do, and asserts the records it
      returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `checkConflictMarkers`, each by an
      assertion that a defect in it would change. Errors: a directory that
      exists and is not a git repository yields a `fail` record whose
      evidence carries git's own complaint, which says it is not a git
      repository, and not node's wording of the failed command, which opens
      `Command failed`; a revision git cannot find, such as a branch that
      does not exist, for which git exits without a word, yields one whose
      evidence opens `revision "<revision>" names no commit: ` and goes on
      to name the git command that failed, which holds
      `<revision>^{commit}`; a revision that is empty, or that begins with a
      minus sign, yields one whose evidence reads exactly `revision
      "<revision>" names no commit`, before git runs; and a revision one
      character long that names a commit, such as `@`, is resolved and
      judged like any other.
  - type: behavior
    statement: >
      Paths: in the evidence of a marker the range adds, the path of the file is
      printed with every character below U+0020, the character U+007F and
      every character from U+0080 to U+009F written as `\u{` and four
      hexadecimal digits and `}` - a tab as `\u{0009}` - and every other
      character as it is, U+00A0 and a letter such as U+00E9 among them.
  - type: behavior
    statement: >
      Lines: in one range, a file whose change removes lines - one that
      replaces a line, and one that only deletes lines - followed in git's
      order of paths by a file that gains a conflict block yields exactly
      the markers of that block, with their files and lines, and nothing
      else; and a range that adds no marker passes with the evidence
      `<n> added line(s) in "<base>"..."<candidate>" hold no conflict
      marker`, `<n>` being the number of lines the range adds, asserted as
      a number the test computes from the lines it wrote.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      every marker is built at run time, so no line of the test file is
      itself one; a git that fails is made by the repository the test
      builds, never by a stub on the path; nothing is installed or fetched;
      and no test reads src/conflict-markers.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-43.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/conflict-markers.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-conflict-markers]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

