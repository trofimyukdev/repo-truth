id: RT-45
repo: repo-truth
priority: 44
milestone: M0
title: Suite strength, raised timeouts - tests that fail on the defects the mutation probe found unasserted in src/checks/raised-timeouts.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The check
  of raised timeouts (RT-24) merged with such survivors: defects in how
  git's own error reaches the evidence, in how a revision that cannot be a
  commit is refused before git runs, in how a tilde is printed, in how a
  test file that becomes a symbolic link, or stops being one, is read, in
  how lines are numbered when the base's file does not end in a newline,
  in how a match that holds no number is dropped, and in how a sanction's
  reason is read from the caller and from a commit message. Each one is a
  way the check could break without a test saying so. This task adds the
  tests that say so. It changes no source file.

  Written on 2026-10-18 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe recorded as surviving back into the module and demands that the
  suite turn red on each. Every file holding a timeout that the suite
  needs is written at run time into a throwaway repository, as the suite
  already does, so the test file sets no timeout of its own.

measure:
  - npx vitest run test/unit/raised-timeouts.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/checks/raised-timeouts.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/raised-timeouts.test.ts changes - the module, another test, a runner configuration, a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/raised-timeouts.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/raised-timeouts.test.ts calls `check` of
      src/checks/raised-timeouts.ts over real throwaway repositories, as its
      existing cases do, and asserts the records it returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `check`, each by an assertion that a
      defect in it would change. Errors: a directory that exists and is not
      a git repository yields a `fail` record whose evidence carries git's
      own complaint, which says it is not a git repository, and not node's
      wording of the failed command, which opens `Command failed`; a
      revision that is empty, or that begins with a minus sign, yields one
      whose evidence reads exactly `revision "<revision>" does not name a
      commit`, before git runs; and a revision one character long that
      names a commit, such as `@`, is resolved and judged like any other.
  - type: behavior
    statement: >
      Files and lines: a tilde in a test file's path, the last printable
      ASCII character, is printed in the evidence as it is; a test file that
      is a symbolic link at the merge base and a regular file at the
      candidate is read whole, every line as added, so a timeout on its
      second line is reported as `timeout-added` at line 2; a test file
      holding a timeout that becomes a symbolic link, and a symbolic link
      the range points somewhere else, report nothing and pass; and when the
      base's file does not end in a newline and the range raises the
      timeout on its last line, the finding names that line's number in the
      candidate.
  - type: behavior
    statement: >
      Matches and sanctions: a match whose `value` group holds no finite
      number - from an entry a consumer appends to `TIMEOUT_SPELLINGS` whose
      group can hold a word, the list put back as it was after the test - is
      no finding, so the range passes; a reason the caller gives in
      `sanctions` that is empty or only blanks sanctions nothing, so the
      finding stays open and the record fails, while a reason one character
      long sanctions it; a finding sanctioned by a line of a commit message
      of the range, by its id and by its category and file, is printed with
      ` - sanctioned: <reason>`, the reason exactly as that line gives it;
      and a sanction line that names one finding leaves open another whose
      id is exactly as long, a timeout added at the same line of a second
      test file, so the record fails.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      every file holding a timeout and every symbolic link a test needs is
      written there at run time; a git that fails is made by the repository
      the test builds, never by a stub on the path; nothing is installed or
      fetched; and no test reads src/checks/raised-timeouts.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-45.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/raised-timeouts.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
