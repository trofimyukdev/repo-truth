id: RT-95
repo: repo-truth
priority: 28
milestone: M0
title: Raised timeouts read a value written with the digit separator - `300_000`, `1_000.5` - whole

outcome: >
  RT-24 (src/checks/raised-timeouts.ts) reads a timeout's value with a
  pattern that knows digits and one decimal point, but not the digit
  separator `_` that JavaScript and TypeScript allow between two digits of
  a numeric literal. A value written `10_000` is read as `10` and
  `300_000` as `300`, and a value whose separator stands just before the
  closing parenthesis of the test timeout argument (`}, 30_000);`) is not
  read at all. So the check judges the wrong numbers: a raise from `5000`
  to `10_000` is compared as 10 against 5000 and passes; a raise from
  `500_000` to `1_000_000` passes; a lowering from `30_000` to `10000` is
  compared as 30 against 10000 and fails as a raise; a test timeout
  argument raised from `5000` to `30_000`, or added as `30_000` to a file
  the merge base holds, passes; and where the verdict is right the
  evidence names the wrong figure (`added timeout option timeout 300`).
  This task makes RT-24 read such a value whole, in every spelling of
  `TIMEOUT_SPELLINGS`, and changes nothing else it does.

  What a value is: one or more digits, then any number of groups of a
  `_` followed by one or more digits, then optionally a `.` and a
  fraction of the same form - `5000`, `10_000`, `1_000_000`, `1_000.25`,
  `1.000_25`. Values are compared as numbers with each `_` that stands
  between two digits dropped, so `10000` and `10_000` are equal (a `_`
  anywhere else, which only an entry a consumer appends can capture,
  leaves the value as the merge base reads it), and a raise is a
  candidate value
  greater than the paired base value, as before. The evidence line, and
  the finding's `oldValue` and `newValue`, name each value as the line
  writes it, separators included: `raised timeout option timeout from
  5000 to 10_000`, `added test timeout argument 30_000`. A finding's id,
  its category, its file and line, the pairing of removed and added
  values by setting, the sanctions, the pass line `no timeout raised or
  added` and the fail-closed record are as at the merge base.

  Not in this task: a value written in exponent form (`1e4`), in hex,
  binary or octal, as a BigInt (`10_000n`), or through a constant or an
  expression. In the five spellings this module ships, a `_` that does
  not stand between two digits (`6000_`, `1__000`) is not part of the
  value, as at the merge base: `{ timeout: 6000_ }` is read as `6000`.

  The project_truth rung runs this package's own checks over the change,
  RT-24 among them, which reports a timeout a range adds to a test file
  the merge base holds; test/unit/raised-timeouts.test.ts is such a file.
  So the lines this task adds there hold no timeout in a spelling
  `TIMEOUT_SPELLINGS` reads, separated or not: a value sits in a string
  constant on a line of its own, such as `const SEPARATED = "10_000";`,
  and the fixture's text is built from it, as the suite's own `SHORT`
  and `LONG` already are.

  Written on 2026-11-02 under the maintainer's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it.

measure:
  - npx vitest run test/unit/raised-timeouts.test.ts

not_done_if:
  - "a value that carries the separator on the base side only - `5_000` raised to `6000`, `30_000` lowered to `10000` - is judged by anything but its whole number: the raise is not a `fail` with the one evidence line `<file>:<line>: raised timeout option timeout from 5_000 to 6000`, or the lowering is not a `pass`"
  - "a value that carries the separator on the candidate side only - `5000` raised to `60_000`, `50000` lowered to `9_000` - is judged by anything but its whole number: the raise is not a `fail` with the one evidence line `<file>:<line>: raised timeout option timeout from 5000 to 60_000`, or the lowering is not a `pass`"
  - "values that carry the separator on both sides - `5_000` raised to `10_000`, `1_000_000` lowered to `900_000` - are judged by anything but their whole numbers, or the evidence writes either value otherwise than the line does"
  - "a decimal - `1_000.25` raised to `1_000.75`, `1_000.5` lowered to `1_000.25`, and `1.000_25` raised to `1.000_75` with the separator in its fraction - is judged by anything but its whole number with the fraction, or the evidence writes it otherwise than the line does"
  - "a separated value in any of the five spellings - the timeout key, `jest.setTimeout`, the timeout option, mocha's `this.timeout` and the test timeout argument `}, 30_000);` - added to a file the merge base holds is not a `timeout-added` finding whose evidence names the value as written; or a value without a separator is read otherwise than at the merge base, a `_` that does not stand between two digits among them; or one number written two ways (`10000`, `10_000`) is a raise; or a finding's id, its sanction by a `Sanctioned-Weakening:` line, or the pass line `no timeout raised or added` changes form"
  - "`TIMEOUT_SPELLINGS` loses an entry or changes one's name, or a pattern no longer matches its own example; the module exports `optionKinds`; `repo-truth list` does not name RT-24 exactly once; src/registry.ts, src/cli.ts or src/index.ts changes; a test that the merge base's test/unit/raised-timeouts.test.ts declares is removed, renamed, skipped or focused, or a line of it holding `expect(` is removed or rewritten, or the file declares no new test; or any other test file is changed, added, deleted or renamed"
  - "the task changes any file but src/checks/raised-timeouts.ts and test/unit/raised-timeouts.test.ts; the module grows by more than thirty lines; no line the change adds to the module holds an if header, a comparison, `&&` or `||` (the factory's mutation probe plants nothing on such a change); a test file fails, or `npm run typecheck` fails"

acceptance:
  - type: command
    command: npx vitest run test/unit/raised-timeouts.test.ts
    required: true
  - type: command
    command: npm run typecheck
    required: true
  - type: command
    command: 'npm run build && test "$(node dist/cli.js list | grep -c -x RT-24)" = 1'
    required: true
  - type: command
    command: 'npm run build && node --input-type=module -e ''const { execFileSync, spawnSync } = await import("node:child_process"); const { mkdtempSync, mkdirSync, writeFileSync, rmSync } = await import("node:fs"); const { join, resolve } = await import("node:path"); const { tmpdir } = await import("node:os"); const cli = resolve("dist/cli.js"); const t = mkdtempSync(join(tmpdir(), "rt95-")); const d = join(t, "r"); const g = (...a) => execFileSync("git", ["-C", d, "-c", "user.name=T", "-c", "user.email=t@example.com", ...a], { encoding: "utf8" }).trim(); execFileSync("git", ["init", "-q", d]); mkdirSync(join(d, "test")); const f = join(d, "test", "a.test.ts"); const put = (v) => writeFileSync(f, "it(\"x\", async () => {}, { timeout: " + v + " });\n"); put("5000"); g("add", "-A"); g("commit", "-q", "-m", "base"); const c0 = g("rev-parse", "HEAD"); put("10_000"); g("commit", "-q", "-am", "raise"); const c1 = g("rev-parse", "HEAD"); put("9_000"); g("commit", "-q", "-am", "lower"); const run = (b, c) => spawnSync(process.execPath, [cli, "check", "--no-fetch", "--check", "RT-24", "--base", b, "--candidate", c, "--format", "json"], { cwd: d, encoding: "utf8" }); const r1 = run(c0, c1); const r2 = run(c1, "HEAD"); rmSync(t, { recursive: true, force: true }); const rec = (r) => { try { return JSON.parse(r.stdout).records[0]; } catch { return null; } }; const a = rec(r1); const b = rec(r2); process.exitCode = Number(!(r1.status === 1 && a && a.name === "RT-24" && a.status === "fail" && a.evidence.length === 1 && a.evidence[0] === "test/a.test.ts:1: raised timeout option timeout from 5000 to 10_000" && r2.status === 0 && b && b.status === "pass" && b.evidence.length === 1 && b.evidence[0] === "no timeout raised or added"))'''
    required: true
  - type: behavior
    statement: >
      src/checks/raised-timeouts.ts exports `name`, which is "RT-24",
      `check`, and `TIMEOUT_SPELLINGS` with five entries named
      `timeout key`, `jest.setTimeout`, `timeout option`,
      `mocha this.timeout` and `test timeout argument`, each with an
      `example` its `pattern` matches; it exports no `optionKinds`. Its header comment says
      that a value may carry the digit separator `_` between digits, in its
      integer part and in its fraction, that values are compared with the
      separators dropped, and that the evidence names each value as the
      line writes it. `check` returns a record and never throws: the fourth
      command item above runs a raise to a separated value, and a lowering
      between two, through the built command.
  - type: behavior
    statement: >
      Tests in test/unit/raised-timeouts.test.ts call `check` over
      throwaway repositories and assert the status and the evidence of the
      record, and the findings' `oldValue` and `newValue`, for: a separated value on the base side only, raised and lowered;
      on the candidate side only, raised and lowered; on both sides, raised
      and lowered; a decimal separated in its integer part, raised and
      lowered, and one separated in its fraction, raised; a separated value
      in each of the five spellings; and one number written with and
      without the separator on the two sides, which is no raise. The values
      these tests use sit in string constants, so no line of the file holds
      a timeout in a spelling the check reads.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-95.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

