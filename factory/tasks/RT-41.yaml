id: RT-41
repo: repo-truth
priority: 48
milestone: M0
title: Suite strength, the Action's program - tests that fail on the defects the mutation probe found unasserted in src/action.ts

outcome: >
  The factory measures how strong a module's tests are by planting small
  defects in it and counting the ones no test notices. The Action's own
  module (src/action.ts, last changed by RT-40) merged with such
  survivors: defects in how a merge base that git cannot find is reported
  - in a checkout that is shallow, between two commits that share no
  history, and for a revision git cannot read, whose complaint must reach
  the message as git wrote it - and in how the module runs when node runs
  it as a program, and when the command it runs cannot be loaded, which no
  test does today. Each one is a way the Action could break without a test
  saying so. This task adds the
  tests that say so. It changes no source file.

  Written on 2026-10-17 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe recorded as surviving back into the module and demands that the
  suite turn red on each. Like RT-39, the program tests find the compiler
  the way node finds a package, so the suite is green in a checkout whose
  dependencies are installed in the checkout itself and in one whose
  dependencies are installed in a directory above it.

measure:
  - npx vitest run test/unit/action.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/action.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/action.test.ts changes - the module, another test, action.yml, package.json, README.md, a tsconfig - so the change is not one of tests alone"
  - "the suite fails on the module as it stands - in a checkout whose dependencies are installed in the checkout itself, or in one whose dependencies are installed in a directory above it - depends on the order or the timing of its cases, or leaves files in the repository - a build written into dist/ among them - or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/action.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/action.test.ts calls the exports of src/action.ts
      over real throwaway repositories, as its existing cases do, and
      asserts what each returns or throws; the cases that run the module as
      a program assert the exit code, stdout and stderr of node's run, as
      the item that opens `As a program` says.
  - type: behavior
    statement: >
      The suite pins these behaviors of `resolveMergeBase`, each by an
      assertion that a defect in it would change. In a shallow checkout
      that lacks the history joining the two commits, it rejects with a
      `RangeResolutionError` whose message says the checkout is shallow
      and names `fetch-depth: 0`. In a checkout that is not shallow, for
      two commits that share no history - a branch made with `git checkout
      --orphan`, say - it rejects with a `RangeResolutionError` whose
      message says the two share no history and does not say the checkout
      is shallow. For a target that names no commit, such as a branch that
      does not exist, it rejects with a `RangeResolutionError` whose
      message opens `could not compute the merge base of` and carries git's
      own complaint, which names that target, and not node's wording of the
      failed command, which opens `Command failed`.
  - type: behavior
    statement: >
      As a program: the module compiled with the project's own build
      settings (tsconfig.build.json) into a directory under the operating
      system's temporary directory, and the compiled action.js given to
      node as its script with GITHUB_STEP_SUMMARY naming a file in the
      temporary directory, answers `--help` by printing on stdout the usage
      `main(["--help"])` prints in the suite's own process, writing nothing
      to stderr, exiting 0 and leaving in that file exactly `jobSummary(0,
      <that usage>)`, so the test holds no copy of the usage. With the
      compiled cli.js removed from that directory, so that the command
      cannot be loaded, the same run prints nothing on stdout, writes to
      stderr a line that opens `repo-truth: ` and exits 2. The compiler is
      the `typescript` package the project depends on, found the way node
      resolves a package from the test file (for instance
      `createRequire(import.meta.url).resolve` of its `bin/tsc`), never by a
      path the test joins to the project root or to its own directory.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures and the compiled program
      are made at run time under the operating system's temporary directory
      and removed when the suite ends, whether it passed or not, and nothing
      is written into the repository - no dist/ among it; the registry is
      put back as it was after every test; a git that fails is made by the
      repository the test builds, never by a stub on the path; nothing is
      installed or fetched from the network; and no test reads src/action.ts
      as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-41.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/action.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - action.yml
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-action]
exclusive_resources: []

