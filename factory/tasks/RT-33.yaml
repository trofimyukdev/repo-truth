id: RT-33
repo: repo-truth
priority: 56
milestone: M0
title: Ladder commands changed - an entry of a package.json's scripts that the range adds, removes or changes

outcome: >
  A repository's checks run through its manifest: `npm test` runs whatever
  the `test` entry of `scripts` says, and a workflow step that runs `npm run
  lint` trusts the `lint` entry. So a range that edits `scripts` can make
  its own checks pass by changing what they run - a test command given a
  flag that passes when no test is found, a typecheck entry replaced by a
  command that always succeeds - and the edit is one line in a JSON file.
  This check reads every package.json the range adds, deletes, changes or
  renames, at the root or below it, whole at the merge base and at the
  candidate, and reports each entry of `scripts` the range adds, removes or
  changes, with the file, the entry and the commands - for a human to
  sanction or refuse. A change to another field of a manifest, a reordering
  of its keys or a change of its white space, and a manifest the range
  leaves alone say nothing. A manifest that cannot be read as a JSON object
  at either end is a failure that names it, because a check that cannot
  tell whether the scripts changed does not say they did not.

  Written on 2026-10-11 by the operator's word of that day, under his rule
  of 2026-09-30 that every not_done_if line of a spec in this repository
  is covered by a holdout acceptance item or by a deterministic check the
  spec names: the holdout item below is the gate's, and the builder is
  never shown it. It is written as one module of the check directory RT-22
  builds, so it touches neither the registry nor the command. The factory
  that builds this repository refuses a change to the `scripts` field of
  any package.json, at the root or below it, so this task never edits this
  repository's own manifest and adds no file named package.json anywhere:
  every manifest its tests need is written at run time into a throwaway
  repository.

measure:
  - npx vitest run test/unit/script-changes.test.ts
  - npm run build && node --input-type=module -e 'const r = await import("./dist/registry.js"); process.exitCode = Number(!r.REGISTRY.some((e) => e.name === "RT-33"))'

not_done_if:
  - "an entry of `scripts` that the range adds, removes or changes, in a package.json at the root or below it, passes - in a manifest the range adds or deletes as in one it changes"
  - "a change to another field of the manifest, a reordering of its keys or a change of its white space, a manifest renamed with its scripts as they were, or a manifest the range leaves alone is reported, so the check fires on ordinary edits and gets switched off"
  - "the manifest is read from the working tree or from the lines of the patch rather than parsed whole at the merge base and at the candidate through git, so a reformatted file or an entry moved across lines hides a change"
  - "a manifest that cannot be read as a JSON object at either end, or whose `scripts` is not an object of strings, is reported as a pass or passed over instead of a `fail` record naming the file"
  - "a finding has no way to be sanctioned in the range's commit messages or by the caller, or a sanction is read from anywhere else"
  - "a finding does not name the file, the entry and its commands, with every character outside printable ASCII escaped"
  - "the task changes this repository's own package.json, or adds a file named package.json anywhere in it, so the factory that builds it refuses the change"
  - "a revision that names no commit, or a git invocation that fails, is reported as a pass or thrown to the caller instead of a `fail` record naming the cause"
  - "the check is not a module of the check directory, or changes src/registry.ts or src/cli.ts, so `repo-truth check --check RT-33` does not run it alone after `npm run build`"

acceptance:
  - type: command
    command: npx vitest run test/unit/script-changes.test.ts
    required: true
  - type: command
    command: npm run build && node --input-type=module -e 'const r = await import("./dist/registry.js"); process.exitCode = Number(!r.REGISTRY.some((e) => e.name === "RT-33"))'
    required: true
  - type: behavior
    statement: >
      `src/checks/script-changes.ts` is a module of the check directory in
      RT-22's form: it exports `name`, the string `RT-33`, and
      `check(options)`, where `options` is `{ cwd, base, candidate,
      sanctions? }`, which resolves to a `CheckRecord` (src/index.ts) named
      `RT-33` that also carries `findings`. It imports nothing from
      src/registry.ts or src/cli.ts and only types from src/index.ts. It
      reads, through git with an argument vector and never from the working
      tree, the paths that change between the merge base of `base` and
      `candidate` and `candidate`, with renames detected; for each whose
      file name is `package.json`, at the root or below it, the whole file
      at the merge base and at the candidate; and the messages of the
      commits in `base..candidate`.
  - type: behavior
    statement: >
      A manifest absent at one end holds no scripts there, and one with no
      `scripts` field holds none either. A manifest present at an end is
      parsed as JSON; one that is not a JSON object there, or whose
      `scripts` is not an object whose values are strings, yields a `fail`
      record whose evidence names the file and the end. Entries are compared
      by key: a key only the candidate holds is a finding of category
      `script-added`, one only the merge base holds `script-removed`, and
      one both hold with a different command `script-changed`. The order of
      the keys, the white space and every other field of the manifest are
      not compared, and a renamed manifest is read at its old path at the
      merge base and at its new path at the candidate.
  - type: behavior
    statement: >
      A finding is sanctioned by a line `Sanctioned-Weakening: <id> <reason>`
      in a commit message of the range - the key is `SANCTION_KEY`, imported
      from src/weakened-tests.ts rather than written again - or by the
      caller's `sanctions`, a plain object whose keys are ids and whose
      values are the reasons. A finding's id is `<category>:<file>:<key>`,
      and `<category>:<file>` sanctions every finding of that category in
      that file. Each finding is one evidence line that opens with
      `<file>:`, and holds the word `added`, `removed` or `changed`, the
      entry's key in double quotes, and its command at the merge base, at
      the candidate or at both, each in double quotes, with every character
      outside printable ASCII escaped; a sanctioned finding's line also
      holds the word `sanctioned` and the reason. The record fails while any
      finding is unsanctioned and passes once every one is, listing them;
      with no finding it passes with one evidence line holding `no scripts
      entry added, removed or changed`.
  - type: behavior
    statement: >
      The check fails closed: a revision that names no commit yields a
      `fail` record whose evidence names that revision, and any other git
      invocation that fails yields one whose evidence names the cause -
      never a `pass`, and never a thrown error. Tests build real throwaway
      repositories and drive an entry added, one removed and one changed; a
      manifest below the root; a manifest the range adds and one it deletes;
      a manifest renamed with its scripts as they were; a change to another
      field, a reordering of the keys and a change of white space alone; a
      manifest that is not JSON at the candidate and one whose `scripts` is
      not an object; a key holding a colon; a sanction by line, by category
      and file and by option, and a sanction written in a file rather than
      a commit message; and a revision that names no commit, and assert the
      record of each; and one test runs `main` of src/cli.ts with `check`,
      `--check RT-33`, `--no-fetch` and `--format json` over a throwaway
      repository and asserts exactly one record, `RT-33`. Every manifest a
      test needs is written at run time into a throwaway repository under
      the operating system's temporary directory, removed when the suite
      ends; each fixture number sits in a constant declared on a line of its
      own whose text holds none of the words threshold, coverage, minimum,
      min, maximum, max, at least or at most. The module stays within about
      two hundred and fifty lines.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-33.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - src/checks/script-changes.ts
  - test/unit/script-changes.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - src/registry.ts
  - src/cli.ts
  - src/index.ts
  - src/weakened-tests.ts
  - src/lockfile-drift.ts
  - test/e2e/**

dependencies: [RT-22]
discovered_from: null
resources: [repo-truth:scripts]
exclusive_resources: []

risk:
  level: medium
  dimensions: [contract, security]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
