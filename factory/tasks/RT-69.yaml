id: RT-69
repo: repo-truth
priority: 22
milestone: M0
title: Suite strength, weakened workflows - tests that fail on the defects the mutation probe leaves unasserted in src/checks/workflow-weakening.ts

outcome: >
  The factory measures how strong a module's tests are by planting small
  defects in it and counting the ones no test notices. Taken on
  origin/main with the factory's own mutation generator, the suite of
  src/checks/workflow-weakening.ts (RT-56) leaves such defects alive: in
  how git's own complaint reaches the evidence when it refuses a revision,
  in which revisions are refused before git is asked, in which characters
  count as printable, in how a line that ends in a carriage return is
  read, in which renamed files are compared with their source, and in how
  a caller's reason and a sanction line for another file are read. Each
  one is a way the check could break without a test saying so. This task
  adds the tests that say so. It changes no source file.

  Written on 2026-10-24 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe leaves surviving back into the module and demands that the suite
  turn red on each.

  The project_truth rung runs this package's own checks over the change,
  among them RT-24, which reports a timeout setting a range adds to a test
  file the merge base holds; so the tests this task adds set no timeout of
  their own.

measure:
  - npx vitest run test/unit/workflow-weakening.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/checks/workflow-weakening.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/workflow-weakening.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/workflow-weakening.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/workflow-weakening.test.ts calls `check` of
      src/checks/workflow-weakening.ts over real throwaway
      repositories, as its existing cases do, and asserts the records
      it returns.
  - type: behavior
    statement: >
      Revisions: a revision git does not resolve - a branch that does
      not exist - yields a `fail` record whose evidence opens
      `revision "<the revision>" does not name a commit: ` followed by
      a cause that is not empty; an empty revision and one that begins
      with a dash are refused before git is asked, with the evidence
      exactly `revision "" does not name a commit` and `revision "-x"
      does not name a commit`; and a revision one character long - a
      branch named `b` - is read like any other.
  - type: behavior
    statement: >
      Lines and renames: a line that ends in a carriage return is read
      as the same line without it, so a workflow written with CRLF
      line ends that gains the line `continue-on-error: true`, with no
      indentation, is reported with that text; a workflow renamed
      within .github/workflows/ that keeps a weakening line it already
      held is no finding, and the range passes with the evidence
      exactly `no workflow weakened`; a file moved into
      .github/workflows/ from outside it is compared with nothing, so
      a weakening line it held before the move is reported; and a
      workflow whose name holds a tilde is written as it is.
  - type: behavior
    statement: >
      Sanctions: a caller's reason one character long sanctions its
      finding, the evidence ending ` - sanctioned: x`, and a reason of
      white space alone sanctions nothing; and a
      `Sanctioned-Weakening:` line of the range that names another
      workflow, its id as long as the finding's, sanctions nothing.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its
      own whose text holds none of the words threshold, coverage,
      minimum, min, maximum, max, at least or at most, so that a later
      edit of a fixture is not read as a bound moved in a test.
      Fixtures are built at run time, those that need a repository in
      throwaway repositories under the operating system's temporary
      directory, removed when the suite ends whether it passed or not;
      a git that fails is made by the repository the test builds,
      never by a stub on the path; nothing is installed or fetched;
      and no test reads src/checks/workflow-weakening.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-69.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/workflow-weakening.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - action.yml
  - repo-truth.json
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-workflow-weakening]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
