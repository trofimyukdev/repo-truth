  - factory/**
  - .github/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - src/registry.ts
  - src/cli.ts
  - src/index.ts
  - src/weakened-tests.ts
  - test/e2e/**

