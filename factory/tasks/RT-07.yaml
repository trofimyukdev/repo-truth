id: RT-07
repo: repo-truth
priority: 76
milestone: M0
title: One entry point - `repo-truth check` runs the checks and answers with records

outcome: >
  Six checks that each have to be imported and wired by hand are a library; one
  command that runs them over a range and prints what it found is a gate somebody
  else can adopt. `repo-truth check --base <rev> --candidate <rev>` runs every
  registered check, prints the records in a form a human reads and a form a
  machine parses, and exits on a stated code. What makes this a task of its own
  rather than a wrapper is the exit-code contract: the difference between "a check
  found a defect" and "the tool could not run" has to be visible to a caller that
  reads nothing but the exit status, or every CI adopting this will treat a broken
  invocation as a clean repository.

  REISSUED on 2026-09-29 by the operator's word. The first version of this
  task spent its quality attempts: the reviewer refused its first candidate,
  and the fix cycle's candidate passed the reviewer and was refused by the gate
  on condition 2 alone, over one prose entry about the unrun smoke stage (the
  controller's journal of this repository, GATE_FAILED seq 1079). Nothing below
  changed then: that version was the same task, enqueued again so that the
  factory took it from the start.

  REISSUED AGAIN on 2026-09-29 by the operator's word, with one case added.
  The second version's candidate passed the gate (GATE_PASSED seq 1129 of the
  same journal) and was held by the shadow merge policy. Built and run by hand
  after the gate, it answered a `--base` that names no commit in the repository
  with the failed-check code instead of the bad-invocation code: the revision
  reached a check unresolved and came back as that check's `fail` record, which
  is the not_done_if line that opens "a failed check and a failed invocation
  share an exit code". The acceptance and not_done_if below now name that case;
  the rest of the task is unchanged, and the factory takes it from the start
  again.

measure:
  - npx vitest run test/unit/cli.test.ts

not_done_if:
  - "a failed check and a failed invocation share an exit code, so a CI job that reads only the status treats a crash as a pass or a pass as a crash"
  - "a revision that names no commit reaches a check unresolved and comes back as that check's `fail` record, so the failed-check code answers for an invocation that could not run"
  - "the machine-readable output is the human output with the colours removed, so any change to the wording breaks every parser downstream"
  - "the check list is assembled inside the command, so adding a check means editing the command and the two can disagree about what ran"
  - "a check that throws takes the whole command down, and the records the other checks already produced are lost"
  - "the command resolves the base from a local ref without fetching, reintroducing the stale-base hole RT-01 closes inside its own check"
  - "there is no way to run a subset, so a repository adopting one check has to accept all of them or none"

acceptance:
  - type: command
    command: npx vitest run test/unit/cli.test.ts
    required: true
  - type: behavior
    statement: >
      The exit codes are stated in one place and pinned by a test each: success,
      at least one check failed, and bad invocation or unrunnable environment are
      three distinct codes, and the third is never returned for the second.
  - type: behavior
    statement: >
      A `--base` or a `--candidate` that names no commit in the repository - a
      typo, or a revision the checkout does not hold - makes the environment
      unrunnable whether or not the command fetched first: it exits with the
      bad-invocation code, writes nothing to stdout, names the revision on
      stderr, and runs no check. A test drives `--base` and `--candidate` each
      with a revision that does not exist and asserts the code and the empty
      stdout.
  - type: behavior
    statement: >
      The registry of checks is data the command reads, not a list inside it. A
      test asserts that the command runs exactly what the registry holds, so a
      check added to the registry cannot be silently absent from a run.
  - type: behavior
    statement: >
      A check that throws is turned into a `fail` record naming the check and the
      error, and the run continues; a test drives a deliberately throwing check
      and asserts the other checks' records still reach the output.
  - type: behavior
    statement: >
      The machine-readable output is a documented structure emitted independently
      of the human rendering, and a test parses it rather than matching a
      substring of the prose.

allowed_paths:
  - src/**
  - test/unit/**
  - package.json
forbidden_paths:
  - factory/**
  - README.md
  - LICENSE

dependencies: [RT-01]
discovered_from: null
resources: [repo-truth:cli]
exclusive_resources: []

risk:
  level: medium
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
