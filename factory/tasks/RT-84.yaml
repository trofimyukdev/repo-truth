id: RT-84
repo: repo-truth
priority: 22
milestone: M0
title: Suite strength, the configuration reader, again after RT-75, names and values - tests that fail on the defects the mutation probe leaves unasserted in src/config.ts

outcome: >
  The factory measures how strong a module's tests are by planting small
  defects in it and counting the ones no test notices. RT-67 strengthened
  the suite of src/config.ts, and RT-75 has changed the module since: it
  now refuses a document in which an object gives one member name twice.
  Taken again on origin/main with the factory's own mutation generator,
  the module's suites - test/unit/config.test.ts and
  test/unit/config-duplicates.test.ts - leave alive defects in how that
  scan tells a member's name from a value: a string value, or a string in
  an array, read as a name. Each one is a way the reader could refuse a
  sound document without a test saying so. This task adds the tests that
  say so. It changes no source file.

  Written on 2026-10-26 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe leaves surviving back into the module and demands that the suite
  turn red on each.

  The project_truth rung runs this package's own checks over the change,
  among them RT-24, which reports a timeout setting a range adds to a test
  file the merge base holds; so the tests this task adds set no timeout of
  their own.

measure:
  - npx vitest run test/unit/config-duplicates.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/config.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/config-duplicates.test.ts changes - the module, another test, or a fixture committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/config-duplicates.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/config-duplicates.test.ts calls
      `parseConfig` of src/config.ts with option kinds of the suite's
      own, as its existing cases do, and asserts the whole list of
      issues it refuses a document with, or that it reads the
      document.
  - type: behavior
    statement: >
      A value is never taken for a member name: an option whose value
      is a string equal to the option's own name gets only the issue
      its kind gives - for an integer option `maxBytes` of RT-12,
      `checks.RT-12.maxBytes: expected a non-negative safe integer,
      found "maxBytes"` - and no `given more than once` issue.
  - type: behavior
    statement: >
      Equal strings in an array are never a repeat: a check's
      `strings` option given `["a","a","b"]` is read without an issue.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its
      own whose text holds none of the words threshold, coverage,
      minimum, min, maximum, max, at least or at most, so that a later
      edit of a fixture is not read as a bound moved in a test.
      Fixtures are built at run time, those that need a repository in
      throwaway repositories under the operating system's temporary
      directory, removed when the suite ends whether it passed or not;
      a git that fails is made by the repository the test builds,
      never by a stub on the path; nothing is installed or fetched;
      and no test reads src/config.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-84.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/config-duplicates.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - action.yml
  - repo-truth.json
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-config-again]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
