id: RT-37
repo: repo-truth
priority: 52
milestone: M0
title: Suite strength, dependency sources - tests that fail on the defects the mutation probe found unasserted in src/dependency-sources.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The
  dependency sources check (RT-18) merged with such survivors: defects in
  how git's own error reaches the evidence, in how a revision that cannot
  be a commit is refused before git runs, in what counts as a manifest at
  the root and what a manifest that is not a JSON object means, in how the
  package a dependency key or an `npm:` alias names is read when that name
  is short or scoped, in how a resolved URL with no host or a one-letter
  host is named, and in what a range that only removes lockfile lines
  means. Each one is a way the check could break without a test saying
  so. This task adds the tests that say so. It changes no source file.

  Written on 2026-10-14 by the operator's word of that day, under his rule
  of 2026-09-30 that every not_done_if line of a spec in this repository
  is covered by a holdout acceptance item or by a deterministic check the
  spec names: the holdout item below is the gate's, and the builder is
  never shown it. A change of tests alone gives the factory's mutation
  probe nothing to mutate, so the holdout is what shows these tests are
  strong: it plants the defects the probe recorded as surviving into the
  module and demands that the suite turn red on each.

measure:
  - npx vitest run test/unit/dependency-sources.test.ts

not_done_if:
  - "a defect the mutation probe recorded as surviving in src/dependency-sources.ts at RT-18's merge, planted back into the module, still leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/dependency-sources.test.ts changes - the module, another test, package.json, a manifest or a lockfile committed as a fixture - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/dependency-sources.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/dependency-sources.test.ts calls
      `checkDependencySources` over real throwaway repositories and asserts
      the records it returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `checkDependencySources`, each by an
      assertion that a defect in it would change. Errors: a directory that
      is not a git repository yields a `fail` record whose evidence carries
      git's own complaint and not node's wording of the failed command; a
      revision that names no commit yields one whose evidence carries, after
      the revision and the words `names no commit:`, the message of the git
      command that refused it, which names `rev-parse`; a revision that is
      empty, or that begins with a minus sign, yields one whose evidence
      reads exactly `revision "<revision>" names no commit`, before git
      runs; and a revision one character long that names a commit, such as
      `@`, is resolved and judged like any other.
  - type: behavior
    statement: >
      Manifests: an entry named package.json at the root that is not a file,
      such as a directory, is no manifest at that end; and a root
      package.json that parses as JSON but is not an object - an array, a
      string or null - yields a `fail` record whose evidence says it is not
      a JSON object. Package names: a key of `overrides` or `resolutions`
      that carries a version after `@` is judged by the package name before
      it, also when that name is one character long, so a same-name `npm:`
      alias under such a key is no finding; and an `npm:` specifier that
      names its own package - scoped with no version, as `npm:@s/foo` under
      the key `@s/foo`, or one character long with a version, as `npm:a@1.0.0`
      under the key `a` - is no finding either.
  - type: behavior
    statement: >
      Lockfiles: a resolved URL that has no host, such as a `file:` URL, is a
      finding whose evidence names it as unparseable with the URL; a
      resolved URL whose host is one character long is a finding that names
      that host; and a range that only removes lines from a lockfile, with
      no manifest at either end, is a `skip`.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      every manifest and lockfile a test needs is written there at run time;
      a git that fails is made by the
      repository the test builds, never by a stub on the path; nothing is
      installed or fetched; and no test reads src/dependency-sources.ts as
      text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-37.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/dependency-sources.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - test/e2e/**

