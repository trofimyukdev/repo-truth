  - action.yml
  - repo-truth.json
  - src/cli.ts
  - src/registry.ts
  - src/action.ts
  - src/index.ts
  - src/checks/**
  - test/unit/config.test.ts
  - test/unit/cli.test.ts
  - test/unit/cli-config.test.ts
  - test/unit/registry-options.test.ts
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:config-duplicates]
exclusive_resources: []

