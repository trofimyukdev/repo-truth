id: RT-02
repo: repo-truth
priority: 86
milestone: M0
title: The measurement rule over commit bodies and changed documentation

outcome: >
  "A number without a command and a date is not a fact" stops being a sentence
  somebody has to remember. The check reads the commit bodies in `base..candidate`
  and the changed lines of the documentation the range touches, finds the claims
  that carry a figure, and answers whether each one is accompanied by the command
  that prints it and the date it was taken. What it protects is the property that
  makes a report auditable at all: a figure inherited from an upstream document
  is an assumption wearing a number's clothes, and it reads exactly like a
  measurement until somebody tries to re-run it.

  REISSUED on 2026-09-30,
  on the operator's word of that day that every not_done_if line of a spec
  in this repository is covered by a holdout acceptance item or by a
  deterministic check the spec names.
  The first version spent its quality attempts: the verification walk
  refused its first candidate, and the gate refused the second (GATE_FAILED
  seq 218 of the controller's journal of this repository) on two conditions
  nobody could measure - dimensions the reviewer left unverified, and a goal
  evaluator that did not exist yet - while no road led from the gate back
  to a fix cycle. The factory has since gained the goal evaluator, that
  road, a mutation measurement carried to the next pass when its time runs
  out, and a gate that runs holdout items. This version adds one holdout
  item, which the gate runs and the builder is never shown, and states in
  the acceptance below the interface it measures: the function, the name of
  its record, what a block, a command and a date are, and the words its
  evidence uses. The not_done_if lines are unchanged, and the factory takes
  the task from the start again.

measure:
  - npx vitest run test/unit/measurement-rule.test.ts

not_done_if:
  - "the rule is a regular expression over digits, so a version string, an ISO date, a SHA, a section number or a line reference is reported as an unmeasured claim and the check is switched off within a week"
  - "only commit bodies are read and the changed documentation lines are not, or the reverse; the rule applies to both and a check covering half of it will be believed to cover all of it"
  - "the whole file is scanned rather than the lines the range changed, so a repository adopting the check fails on prose nobody in this range wrote"
  - "a claim inside a fenced code block or a quoted transcript is treated as a claim of the author's own"
  - "the check has no way to pass, because every human sentence containing a numeral is a violation of it"

acceptance:
  - type: command
    command: npx vitest run test/unit/measurement-rule.test.ts
    required: true
  - type: behavior
    statement: >
      `src/measurement-rule.ts` exports `checkMeasurementRule(options)`, where
      `options` is `{ cwd, base, candidate }`, and which returns a
      `CheckRecord` (src/index.ts) named `RT-02`, or a promise of one. It
      reads, through git with an argument vector, the body of every commit in
      `base..candidate` - the message without its subject line - and the lines
      the range adds to changed `.md` files.
  - type: behavior
    statement: >
      The check reports as a violation a line of the author's own prose that
      asserts a measured quantity without both a command and a date in the
      same block. A line inside a fenced block, or one that begins with `>`,
      is quoted and not the author's own. A block is the whole body of one
      commit, or one paragraph of a document - the lines between two blank
      lines. A command is an inline code span or a fenced block in that block,
      and a date is an ISO date in it. Each violation is one evidence line
      that names the commit, by the first seven characters of its SHA at
      least, or the document as `<path>:<line>`, and that names the missing
      half by the word `command`, the word `date`, or both - never a half
      the block holds.
  - type: behavior
    statement: >
      What is NOT a claim is pinned by tests, not by a comment: a version, a
      SHA, an ISO date, a section or figure number, a line reference, a path
      containing digits, and any line inside a fenced block each get a case
      asserting the check stays silent about it.
  - type: behavior
    statement: >
      A test drives a range holding one violating body and one compliant body of
      the same shape - same figure, one with its command and date - and asserts
      the check separates them, so the test would fail if the rule degenerated
      into "any digit is a violation".
  - type: behavior
    statement: >
      The check fails closed: a revision that names no commit yields a
      `fail` record whose evidence names that revision, and any other git
      invocation that fails yields one whose evidence names the cause -
      never a `pass`, and never a thrown error.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-02.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - src/**
  - test/unit/**
forbidden_paths:
  - factory/**
  - README.md
  - LICENSE

dependencies: []
discovered_from: null
resources: [repo-truth:git]
exclusive_resources: []

risk:
  level: medium
  dimensions: [contract]

budget:
  quality_attempts: 2
  infra_retries: 3
  builder_usd: 3.00
  verify_usd: 2.00
  wall_minutes: 45

merge: { mode: auto }
