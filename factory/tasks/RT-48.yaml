id: RT-48
repo: repo-truth
priority: 41
milestone: M0
title: Suite strength, snapshot refreshes - tests that fail on the defects the mutation probe found unasserted in src/snapshot-refreshes.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module and counting the ones no test notices. The check
  of snapshot refreshes (RT-16) merged with such survivors: defects in
  how git's own error, and a failure git reports without a word, reach
  the evidence, in how a revision that cannot be a commit is refused
  before git runs, in how a path is escaped in the evidence, in how a
  shape a consumer appends with the global flag is matched, in how git's
  listing of changes is read when a path begins with a colon, in which
  commits the evidence names as beside a code change, and in how a
  sanction's reason is read. Each one is a way the check could break
  without a test saying so. This task adds the tests that say so. It
  changes no source file.

  Written on 2026-10-19 under the operator's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it. A change of
  tests alone gives the factory's mutation probe nothing to mutate, so the
  holdout is what shows these tests are strong: it plants the defects the
  probe recorded as surviving back into the module and demands that the
  suite turn red on each.

measure:
  - npx vitest run test/unit/snapshot-refreshes.test.ts

not_done_if:
  - "a behavior an acceptance item below names is not pinned by an assertion that fails when that behavior of src/snapshot-refreshes.ts changes, so a defect planted in it leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/snapshot-refreshes.test.ts changes - the module, another test, a fixture or a snapshot committed beside the suite - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/snapshot-refreshes.test.ts
    required: true
  - type: behavior
    statement: >
      The suite test/unit/snapshot-refreshes.test.ts calls
      `checkSnapshotRefreshes` of src/snapshot-refreshes.ts over real
      throwaway repositories, as its existing cases do, and asserts the
      records it returns.
  - type: behavior
    statement: >
      The suite pins these behaviors of `checkSnapshotRefreshes`, each by
      an assertion that a defect in it would change. Errors: a directory
      that exists and is not a git repository yields a `fail` record whose
      evidence carries git's own complaint, which says it is not a git
      repository, and not node's wording of the failed command, which opens
      `Command failed`; a revision git cannot find, such as a branch that
      does not exist, for which git exits without a word, yields one whose
      evidence opens `revision "<revision>" does not name a commit: ` and
      goes on to name the git command that failed, which holds
      `<revision>^{commit}`; a revision that is empty yields one whose
      evidence reads exactly `revision "" does not name a commit`, before
      git runs, and so does a revision that begins with a minus sign, `-x`
      say, its own text between the quotes; and a revision
      one character long that names a commit, such as `@`, is resolved and
      judged like any other - a range whose candidate is `@` and which
      refreshes no snapshot passes.
  - type: behavior
    statement: >
      Paths and shapes: a tilde, the last printable ASCII character, is
      printed in the evidence as it is - a refreshed `notes~.snap` is
      reported as `notes~.snap`; a shape a consumer appends to
      `SNAPSHOT_PATHS` whose pattern carries the global flag `g` and is
      anchored at the start of the path, `^`, is reported for a refreshed
      path it matches and no built-in shape matches - `golden/out.txt`, say
      - and once the check has run that pattern's
      `lastIndex` reads 0 again, the list put back as it was after the
      test; and a path that begins with a colon, which git allows, is read
      as a path and never as a line of git's own listing - in a commit that
      refreshes a snapshot and changes nothing else but a test file named
      `:a.test.ts`, the snapshot is not reported as beside a code change,
      and a snapshot renamed with its content unchanged from `:a b c d.snap`
      to `e.snap` is not reported at all.
  - type: behavior
    statement: >
      Commits beside a code change: the evidence names a commit only when
      that commit changes the snapshot's content, under any path the
      snapshot had in the range, or deletes it, and also changes a file
      that is neither a snapshot nor a test. A snapshot the range renames
      in two commits - the first renaming it with its content changed,
      beside a change of a source file, the second renaming it again with
      its content unchanged, beside a change of another source file - is
      reported at its last path as beside a code change in the first
      commit and not in the second; and a source file renamed into a test
      file, in the commit that refreshes the snapshot, is a code change.
  - type: behavior
    statement: >
      Sanctions: a caller's reason that is blank sanctions nothing, so the
      finding is still awaiting a sanction, while a caller's reason one
      character long sanctions it; and a sanction line in a commit message
      names one finding - of two refreshed snapshots whose finding ids are
      equally long, `snapshot-refreshed:a.snap` and
      `snapshot-refreshed:b.snap`, a line for one leaves the other awaiting
      a sanction.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      every snapshot a test needs is written there at run time; a git that
      fails is made by the repository the test builds, never by a stub on
      the path; nothing is installed or fetched; and no test reads
      src/snapshot-refreshes.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-48.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/snapshot-refreshes.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - .gitignore
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-snapshot-refreshes]
