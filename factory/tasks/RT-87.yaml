id: RT-87
repo: repo-truth
priority: 27
milestone: M0
title: Submodules - a submodule the range adds or moves to another commit, or a submodule URL it changes, fails unless a commit message sanctions it

outcome: >
  A submodule is a commit id written into the tree (a gitlink, mode
  160000), and a range that adds one or moves it to another commit brings
  in code that no line of the range's diff shows: the diff holds one line
  with the new commit id, and every check that reads added lines, added
  files or blobs - credentials, conflict markers, binary files, large
  blobs - reads nothing of what the submodule's commit holds. A range that
  changes the `url` of a submodule in .gitmodules points the next update
  at another repository in the same way. No registered check reports
  either today. This task adds a check, RT-87, a module of the check
  directory (src/checks/submodules.ts, no edit of src/registry.ts), that
  fails a range which adds a gitlink, moves one to another commit, or
  changes a submodule URL, naming each, unless a commit message of the
  range sanctions it as RT-33, RT-56 and RT-66 sanction theirs.

  What a finding is: the range is read through git from the merge base of
  `base` and `candidate` to `candidate`, whatever the repository's own
  configuration says about submodules, and never from the working tree;
  no submodule is fetched, initialised or entered. A path that is a
  gitlink at `candidate` is a finding when the merge base holds no gitlink
  at that path (`submodule-added`, its evidence line
  `<path>: submodule-added <commit>`) or holds one with another commit
  (`submodule-moved`, its line `<path>: submodule-moved <old> -> <new>`),
  each commit by its full id; a gitlink the range removes, or leaves at
  the same commit, is no finding. Each `url` value that .gitmodules at
  `candidate` holds and .gitmodules at the merge base does not, in
  whatever section of the file, is a finding `submodule-url` of the file
  .gitmodules, its line `.gitmodules: submodule-url <value>`. Each finding
  is one evidence line that opens `<path>: <category>`, the path from the
  repository's top directory, and a sanctioned one ends
  ` - sanctioned: <reason>`. A finding's id is `<category>:<path>` (for a
  URL, `submodule-url:.gitmodules`), sanctioned by a
  `Sanctioned-Weakening: <id> <reason>` line in a commit message of the
  range or by the caller's `sanctions`, the form
  src/checks/script-changes.ts and src/checks/workflow-weakening.ts state
  in their headers. The check declares no options, so no configuration
  file can quiet it. A range with no finding is a `pass` whose one
  evidence line is `no submodule added or moved, and no submodule URL
  changed`.

  The project_truth rung runs this package's own checks over the change,
  among them RT-24, which reports a timeout setting a range adds to a test
  file the merge base holds; so the tests this task adds set no timeout of
  their own. A test writes a gitlink without a submodule repository, by
  `git update-index --add --cacheinfo 160000,<commit>,<path>`.

  Written on 2026-10-31 under the maintainer's rule of 2026-09-30 that every
  not_done_if line of a spec in this repository is covered by a holdout
  acceptance item or by a deterministic check the spec names: the holdout
  item below is the gate's, and the builder is never shown it.

measure:
  - npx vitest run test/unit/submodules.test.ts

creates_test_files:
  - test/unit/submodules.test.ts

not_done_if:
  - "a range that adds a gitlink - at a new path, or at a path that held a file or a directory - leaves RT-87's record anything but `fail` with the evidence line `<path>: submodule-added <commit>`, the commit by its full id; or a range that moves a gitlink to another commit is not `fail` with the line `<path>: submodule-moved <old> -> <new>`"
  - "a range that removes a gitlink, leaves one at its commit, or touches no submodule is anything but `pass` with the one evidence line `no submodule added or moved, and no submodule URL changed`"
  - "a `url` value that .gitmodules at the candidate holds and the merge base's .gitmodules does not - the file added, or a value changed - is not the finding `.gitmodules: submodule-url <value>`; or a .gitmodules change that adds no `url` value is a finding"
  - "a finding is not made `pass` by a `Sanctioned-Weakening: <category>:<path> <reason>` line in a commit message of the range, or by the caller's `sanctions`, with the reason on its evidence line; or a line naming another category or another path, or one with no reason, sanctions it"
  - "the range is read from anything but the merge base of `base` and `candidate` to `candidate`, through git - a gitlink the other side moved after the merge base is a finding, the working tree is read, or a repository whose configuration sets `diff.ignoreSubmodules` to `all`, or `submodule.<name>.ignore` to `all` (in its configuration or in .gitmodules), hides a finding; or a submodule is fetched, initialised or entered"
  - "a revision that names no commit, or a git that fails, yields anything but a `fail` record naming the cause, or the check throws; or the module exports `optionKinds`, so a configuration file can give it an option"
  - "`repo-truth list` does not name RT-87 exactly once, or src/registry.ts changes"
  - "a test file the merge base holds is changed, deleted or renamed, or test/unit/submodules.test.ts is not a file the task adds"
  - "the task changes any file but src/checks/submodules.ts and test/unit/submodules.test.ts; the module is longer than about two hundred and fifty lines; a test file fails, or `npm run typecheck` fails"

acceptance:
  - type: command
    command: npx vitest run test/unit/submodules.test.ts
    required: true
  - type: command
    command: npm run typecheck
    required: true
  - type: command
    command: 'npm run build && test "$(node dist/cli.js list | grep -c -x RT-87)" = 1'
    required: true
  - type: command
    command: 'npm run build && node --input-type=module -e ''const { execFileSync, spawnSync } = await import("node:child_process"); const { mkdtempSync, writeFileSync, rmSync } = await import("node:fs"); const { join, resolve } = await import("node:path"); const { tmpdir } = await import("node:os"); const cli = resolve("dist/cli.js"); const t = mkdtempSync(join(tmpdir(), "rt87-")); const d = join(t, "r"); const g = (...a) => execFileSync("git", ["-C", d, "-c", "user.name=T", "-c", "user.email=t@example.com", ...a], { encoding: "utf8" }).trim(); execFileSync("git", ["init", "-q", d]); writeFileSync(join(d, "a.txt"), "a\n"); g("add", "-A"); g("commit", "-q", "-m", "base"); const base = g("rev-parse", "HEAD"); g("update-index", "--add", "--cacheinfo", "160000," + base + ",lib/dep"); g("commit", "-q", "-m", "add"); const run = (b, c) => spawnSync(process.execPath, [cli, "check", "--no-fetch", "--check", "RT-87", "--base", b, "--candidate", c, "--format", "json"], { cwd: d, encoding: "utf8" }); const r1 = run(base, "HEAD"); const r2 = run(base, base); const r3 = run("no-such-revision", "HEAD"); rmSync(t, { recursive: true, force: true }); const rec = (r) => { try { return JSON.parse(r.stdout).records[0]; } catch { return null; } }; const a = rec(r1); const b = rec(r2); process.exitCode = Number(!(r1.status === 1 && a && a.name === "RT-87" && a.status === "fail" && a.evidence.some((e) => e.startsWith("lib/dep: submodule-added") && e.includes(base)) && r2.status === 0 && b && b.status === "pass" && r3.status !== 0))'''
    required: true
  - type: behavior
    statement: >
      src/checks/submodules.ts is a module of the check directory: it
      exports `name`, which is "RT-87", and `check`, and no `optionKinds`.
      Its header comment says what a finding is (a gitlink added, a gitlink
      moved to another commit, a `url` value .gitmodules gains), that the
      range is read through git from the merge base and no submodule is
      fetched or entered, the three categories, the id form
      `<category>:<path>` and the `Sanctioned-Weakening:` line that
      sanctions a finding. `check` returns a record and never throws: the
      fourth command item above runs an added gitlink, an empty range and
      a revision that names no commit through the built command.
  - type: behavior
    statement: >
      Tests in test/unit/submodules.test.ts call `check` over throwaway
      repositories and assert the whole record it returns: a range that
      touches no submodule; one that adds a gitlink at a new path, one that
      replaces a file with a gitlink, one that moves a gitlink to another
      commit, one that removes a gitlink and one that leaves it at its
      commit; a .gitmodules added with a `url`, one whose `url` changes and
      one whose change adds no `url`; a finding sanctioned by a commit
      message line, one by the caller's `sanctions`, and a line that names
      another path; a repository whose configuration sets
      `diff.ignoreSubmodules` to `all`, and one that sets
      `submodule.<name>.ignore` to `all` in its configuration and in
      .gitmodules; a range whose other side moved a
      gitlink after the merge base; and a revision that names no commit.
      Gitlinks are written with `git update-index --add --cacheinfo`, and
      fixtures are built under the operating system's temporary directory
      and removed when the suite ends.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-87.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - src/checks/submodules.ts
  - test/unit/submodules.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.build.json
  - action.yml
  - repo-truth.json
  - src/registry.ts
  - src/cli.ts
  - src/config.ts
  - src/action.ts
  - src/index.ts
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:submodules]
exclusive_resources: []

