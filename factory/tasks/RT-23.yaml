id: RT-23
repo: repo-truth
priority: 65
milestone: M0
title: Suite strength, large blobs - tests that fail on the defects the mutation probe found unasserted in src/large-blobs.ts

outcome: >
  The factory measures how strong a check's tests are by planting small
  defects in its module - a comparison turned around, a branch removed, a
  returned value dropped - and counting the ones no test notices. The large
  blobs check (RT-12, with RT-13's changes) merged with such survivors:
  defects in how git's own error reaches the evidence, in how a revision
  that cannot be a commit is refused before git runs, in how a path is
  escaped, and in how a path that is not valid UTF-8 is read. Each one is a
  way the check could break without a test saying so. This task adds the
  tests that say so. It changes no source file: the module is right, its
  suite asks too little of it.

  Written on 2026-10-11 by the operator's word of that day, under his rule
  of 2026-09-30 that every not_done_if line of a spec in this repository
  is covered by a holdout acceptance item or by a deterministic check the
  spec names: the holdout item below is the gate's, and the builder is
  never shown it. A change of tests alone gives the factory's mutation
  probe nothing to mutate, so the holdout is what shows these tests are
  strong: it plants the defects the probe recorded as surviving into the
  module and demands that the suite turn red on each.

measure:
  - npx vitest run test/unit/large-blobs.test.ts

not_done_if:
  - "a defect the mutation probe recorded as surviving in src/large-blobs.ts at RT-13's merge, planted back into the module, still leaves every test of the suite green"
  - "the suite reads the module's source text, or compares it with a copy, so a harmless rewrite of the module turns it red as surely as a defect does"
  - "a test the suite holds at the merge base is deleted, renamed, skipped, focused or made to ask less, so the suite grew stronger in one place by asking less in another"
  - "a file other than test/unit/large-blobs.test.ts changes - the module, another test, package.json - so the change is not one of tests alone"
  - "the suite fails on the module as it stands, depends on the order or the timing of its cases, or leaves files in the repository or in the temporary directory"

acceptance:
  - type: command
    command: npx vitest run test/unit/large-blobs.test.ts
    required: true
  - type: behavior
    statement: >
      The task changes test/unit/large-blobs.test.ts and nothing else.
      Every test that file holds at the merge base stays, under its title,
      with every assertion it makes; the new tests are added beside them and
      call `checkLargeBlobs` over real throwaway repositories, asserting the
      records it returns.
  - type: behavior
    statement: >
      The new tests pin these behaviors of `checkLargeBlobs`, each by an
      assertion on the evidence that a defect in it would change: a
      directory that is not a git repository yields a `fail` record whose
      evidence carries git's own complaint; a revision that names no commit
      yields one whose evidence carries, after the revision, the message of
      the git command that refused it; a revision that is empty, or that
      begins with a minus sign, yields one whose evidence reads exactly
      `large-blobs check could not run: revision "<revision>" names no commit`,
      before git runs; a finding's path is printed with every character
      below 0x20, the character 0x7f and every character from 0x80 to 0x9f
      written as a backslash, `u{`, four lowercase hexadecimal digits and
      `}`, while a space, a tilde and the character 0xa0 are printed as they
      are; and a blob over the limit whose path is not valid UTF-8 is still
      a finding, its path read byte for byte, and never a record that could
      not run.
  - type: behavior
    statement: >
      Each fixture number sits in a constant declared on a line of its own
      whose text holds none of the words threshold, coverage, minimum, min,
      maximum, max, at least or at most, so that a later edit of a fixture is
      not read as a bound moved in a test. Fixtures are built at run time in
      throwaway repositories under the operating system's temporary
      directory and removed when the suite ends, whether it passed or not;
      a git that fails is made by the repository the test builds, never by
      a stub on the path; nothing is installed or fetched; and no test reads
      src/large-blobs.ts as text.
  - type: command
    command: 'f=~/.config/millwright/repo-truth/holdout/rt-23.sh; [ -r "$f" ] || kill -KILL $$; exec sh "$f"'
    required: true
    holdout: true

allowed_paths:
  - test/unit/large-blobs.test.ts
forbidden_paths:
  - factory/**
  - .github/**
  - src/**
  - README.md
  - ROADMAP.md
  - LICENSE
  - package.json
  - package-lock.json
  - test/e2e/**

dependencies: []
discovered_from: null
resources: [repo-truth:suite-large-blobs]
exclusive_resources: []

risk:
  level: low
  dimensions: [contract]

budget:
